<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi Club — Simulación de Modelos Loyalty</title>
  <style>
    :root {
      --bg: #090b0e;
      --panel: #12161f;
      --border: #232836;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #e04a3f;
      --accent-hover: #c7382d;
      --success: #238636;
      --warning: #d29922;
      --danger: #f85149;
      --wa-bg: #0b141a;
      --wa-bubble-me: #005c4b;
      --wa-bubble-sys: #202c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px;
    }

    /* BARRA DE SELECCIÓN DE ENFOQUE (MODELO A vs MODELO B) */
    .system-selector {
      width: 100%;
      max-width: 860px;
      background: #11151f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .sys-tab {
      flex: 1;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .sys-tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.02);
    }

    .sys-tab.active {
      background: #1c2230;
      border-color: #3b455b;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .top-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar h1 {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .workspace {
      display: flex;
      gap: 18px;
      width: 100%;
      max-width: 860px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .screen-col {
      flex: 1;
      min-width: 320px;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .device {
      height: 620px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
      position: relative;
    }

    /* CAJA TERMINAL */
    .caja-top {
      padding: 12px 16px;
      background: #0d0f15;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }

    .status-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .dot-active {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    .caja-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .card {
      background: #171b26;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scanner-mock {
      background: #0d0f15;
      border: 2px dashed #2d3546;
      border-radius: 10px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    .scan-laser {
      position: absolute;
      top: 20%;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: laserMove 2.5s infinite ease-in-out;
    }

    @keyframes laserMove {
      0%, 100% { top: 15%; opacity: 0.4; }
      50% { top: 85%; opacity: 1; }
    }

    .metric-box {
      background: #0d0f15;
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-field {
      width: 100%;
      padding: 10px 12px;
      background: #0d0f15;
      border: 1px solid #283044;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .btn-outline:hover {
      color: var(--text);
      border-color: #3f475a;
    }

    .btn-text {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
    }

    .alert-box {
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .alert-box.warn {
      background: rgba(210, 153, 34, 0.12);
      border-left: 3px solid var(--warning);
      color: #e3b341;
    }

    .alert-box.danger {
      background: rgba(248, 81, 73, 0.12);
      border-left: 3px solid var(--danger);
      color: #ff7b72;
    }

    .alert-box.success {
      background: rgba(35, 134, 54, 0.12);
      border-left: 3px solid var(--success);
      color: #56d364;
    }

    /* WHATSAPP CLIENTE */
    .wa-top {
      padding: 12px 14px;
      background: #202c33;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    .wa-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .wa-chat {
      flex: 1;
      background: var(--wa-bg);
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wa-msg {
      max-width: 88%;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.35;
      animation: msgPop 0.25s ease-out;
    }

    @keyframes msgPop {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .wa-msg.sent {
      background: var(--wa-bubble-me);
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .wa-msg.recv {
      background: var(--wa-bubble-sys);
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .wa-time {
      font-size: 0.62rem;
      color: rgba(255,255,255,0.45);
      text-align: right;
      margin-top: 3px;
    }

    /* Sellos Modelo A */
    .stamps-box {
      background: #11141c;
      border: 1px solid #283042;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      text-align: center;
    }

    .grid-stamps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin: 8px 0;
    }

    .stamp {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px dashed #3a445b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: #64748b;
    }

    .stamp.active {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-weight: bold;
    }

    .stamp.prize {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    .stamp.prize.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }

    /* Puntos Modelo B */
    .points-badge {
      background: #11141c;
      border: 1px solid #283042;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      text-align: center;
    }

    .points-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: #56d364;
      margin: 4px 0;
    }

    .qr-client-img {
      width: 70px;
      height: 70px;
      background: #fff;
      margin: 6px auto 2px;
      border-radius: 4px;
      padding: 4px;
    }

    .qr-lines {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, #111, #111 4px, #fff 4px, #fff 8px);
    }

    /* CONTROLES INFERIORES */
    .controls-panel {
      width: 100%;
      max-width: 860px;
      margin-top: 14px;
      background: #10131b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-ctrl {
      background: #171b26;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.74rem;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-ctrl:hover {
      color: var(--text);
      border-color: #3b455b;
    }

    .btn-ctrl.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- SELECTOR DE MODELO DE NEGOCIO -->
  <div class="system-selector">
    <button class="sys-tab active" id="tab-model-a" onclick="switchSystemMode('SELLOS')">
      Modelo A: Tarjeta de Sellos (Visitas 1/8)
    </button>
    <button class="sys-tab" id="tab-model-b" onclick="switchSystemMode('PUNTOS')">
      Modelo B: Sistema de Puntos ($ / Puntos + Onboarding)
    </button>
  </div>

  <div class="top-bar">
    <h1 id="top-title">SUSHI CLUB · SIMULACIÓN OPERATIVA (SELLOS)</h1>
    <div style="font-size: 0.72rem; color: var(--text-muted);" id="top-sub">
      Flujo reactivo: Terminal de Caja ⇄ WhatsApp
    </div>
  </div>

  <div class="workspace">
    
    <!-- COLUMNA 1: TERMINAL CAJA / ONBOARDING -->
    <div class="screen-col">
      <div class="col-label">
        <span id="col1-title">Terminal del Comercio</span>
        <span id="col1-role">Rol: Cajero</span>
      </div>
      <div class="device">
        <div class="caja-top">
          <span style="font-weight: 700;" id="caja-brand-title">SUSHI CLUB</span>
          <span class="status-tag"><span class="dot-active"></span>Caja 1 · Activa</span>
        </div>
        
        <div class="caja-body" id="caja-view">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

    <!-- COLUMNA 2: WHATSAPP DEL CLIENTE -->
    <div class="screen-col">
      <div class="col-label">
        <span>Celular del Cliente</span>
        <span>Canal: WhatsApp</span>
      </div>
      <div class="device">
        <div class="wa-top">
          <div class="wa-avatar">🍣</div>
          <div>
            <div style="font-weight: 700;">Sushi Club Oficial</div>
            <div style="font-size: 0.65rem; color: #8696a0;">Cuenta comercial verificada</div>
          </div>
        </div>
        
        <div class="wa-chat" id="wa-chat">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

  </div>

  <!-- PANEL DE HISTORIAS INFERIOR -->
  <div class="controls-panel" id="controls-panel">
    <!-- Se inyecta según Modelo A o Modelo B -->
  </div>

  <script>
    let currentSystem = 'SELLOS'; // 'SELLOS' | 'PUNTOS'

    // ==========================================
    // ESTADO PARA MODELO A (SELLOS / VISITAS)
    // ==========================================
    let activeStoryA = 1;
    const stateA = {
      cajaMode: "SCAN_READY",
      client: {
        name: "María González",
        phone: "+54 9 351 512-3456",
        visits: 3,
        max: 8,
        hasAvailablePrize: false,
        prizeCode: "SUSHI-8X91B",
        redeemedAt: null,
        isReusedCodeAttempt: false,
        isImmediateSecondBuyStory: false
      },
      chatHistory: []
    };

    // ==========================================
    // ESTADO PARA MODELO B (SISTEMA DE PUNTOS)
    // ==========================================
    let activeStoryB = 1; // 1: Venta rápida con DNI+Monto, 2: Canje de premio, 3: Wizard de Onboarding
    const stateB = {
      viewMode: "CASH_REGISTER", // CASH_REGISTER | ONBOARDING_WIZARD | PROCESSING | SUCCESS
      config: {
        ratioSpend: 1000, // $1000 = 1 pt
        pointsRate: 1,
        anchorPrice: 10000,
        prizePoints: 200,
        prizeName: "Combo 15 Piezas Gratis"
      },
      client: {
        dni: "38.123.456",
        name: "María González",
        phone: "+54 9 351 512-3456",
        points: 180,
        lastAddedPoints: 0,
        lastSpendAmount: 0
      },
      chatHistory: []
    };

    // CAMBIO DE SISTEMA GENERAL
    function switchSystemMode(mode) {
      currentSystem = mode;
      document.getElementById('tab-model-a').classList.toggle('active', mode === 'SELLOS');
      document.getElementById('tab-model-b').classList.toggle('active', mode === 'PUNTOS');

      if (mode === 'SELLOS') {
        document.getElementById('top-title').innerText = "SUSHI CLUB · SIMULACIÓN OPERATIVA (SELLOS)";
        document.getElementById('top-sub').innerText = "Flujo reactivo: Terminal de Caja ⇄ WhatsApp";
        document.getElementById('col1-title').innerText = "Terminal del Comercio";
        document.getElementById('col1-role').innerText = "Rol: Cajero";
        startStoryA(activeStoryA);
      } else {
        document.getElementById('top-title').innerText = "SUSHI CLUB · SISTEMA DE PUNTOS Y WIZARD";
        document.getElementById('top-sub').innerText = "Fricción cero en caja ($ / Puntos) + Calibración matemática";
        startStoryB(activeStoryB);
      }
    }

    // ==========================================
    // LOGICA MODELO A: SELLOS
    // ==========================================
    function startStoryA(storyId) {
      activeStoryA = storyId;
      stateA.cajaMode = "SCAN_READY";

      if (storyId === 1) {
        stateA.client = {
          name: "María González",
          phone: "+54 9 351 512-3456",
          visits: 3,
          max: 8,
          hasAvailablePrize: false,
          prizeCode: "SUSHI-8X91B",
          redeemedAt: null,
          isReusedCodeAttempt: false,
          isImmediateSecondBuyStory: false
        };
        stateA.chatHistory = [{
          type: "recv",
          text: "¡Hola María! Ya sos parte del Club.<br>⭐ Tenés <b>3 / 8 visitas</b> registradas.<br>Faltan 5 para tu Combo Gratis.",
          snapshotVisits: 3,
          time: "20:10"
        }];
      } else if (storyId === 2) {
        stateA.client = {
          name: "María González",
          phone: "+54 9 351 512-3456",
          visits: 4,
          max: 8,
          hasAvailablePrize: false,
          prizeCode: "SUSHI-8X91B",
          redeemedAt: null,
          isReusedCodeAttempt: false,
          isImmediateSecondBuyStory: true
        };
        stateA.chatHistory = [
          { type: "recv", text: "¡Hola María! ⭐ Tenés <b>3 / 8 visitas</b> registradas.", snapshotVisits: 3, time: "20:10" },
          { type: "recv", text: "🎉 <b>¡Visita acreditada!</b><br>Tu tarjeta ahora está en <b>4 / 8 ⭐</b>.", snapshotVisits: 4, time: "20:45" }
        ];
      } else if (storyId === 3) {
        stateA.client = {
          name: "María González",
          phone: "+54 9 351 512-3456",
          visits: 8,
          max: 8,
          hasAvailablePrize: true,
          prizeCode: "SUSHI-8X91B",
          redeemedAt: null,
          isReusedCodeAttempt: false,
          isImmediateSecondBuyStory: false
        };
        stateA.chatHistory = [{
          type: "recv",
          text: "🎉 <b>¡FELICITACIONES MARÍA!</b><br>Llegaste a tus <b>8 / 8 visitas ⭐</b>.<br><br>🎁 Tenés guardado en tu cuenta:<br><b>Combo 15 Piezas Gratis</b> (<code>SUSHI-8X91B</code>).",
          snapshotVisits: 8,
          time: "Ayer · 21:00"
        }];
      } else if (storyId === 4) {
        stateA.client = {
          name: "Cliente Desconocido",
          phone: "+54 9 351 987-6543",
          visits: 0,
          max: 8,
          hasAvailablePrize: false,
          prizeCode: "SUSHI-8X91B",
          redeemedAt: "Ayer · 21:30",
          isReusedCodeAttempt: true,
          isImmediateSecondBuyStory: false
        };
        stateA.chatHistory = [{
          type: "recv",
          text: "🍣 <b>¡Premio entregado!</b><br>Canjeaste tu Combo 15 Piezas.<br>El código <code>SUSHI-8X91B</code> ha quedado inutilizado.",
          snapshotVisits: 0,
          time: "Ayer · 21:30"
        }];
      }

      renderControlsA();
      renderA();
    }

    function renderControlsA() {
      document.getElementById('controls-panel').innerHTML = `
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Historias (Sellos):</span>
        <div class="controls-btns">
          <button class="btn-ctrl ${activeStoryA === 1 ? 'active' : ''}" onclick="startStoryA(1)">1. Normal (3/8)</button>
          <button class="btn-ctrl ${activeStoryA === 2 ? 'active' : ''}" onclick="startStoryA(2)">2. Doble Compra Sucesiva</button>
          <button class="btn-ctrl ${activeStoryA === 3 ? 'active' : ''}" onclick="startStoryA(3)">3. Premio Guardado (8/8)</button>
          <button class="btn-ctrl ${activeStoryA === 4 ? 'active' : ''}" onclick="startStoryA(4)">4. Cupón Ya Quemado</button>
        </div>
      `;
    }

    function renderA() {
      renderCajaA();
      renderWhatsAppA();
    }

    function renderCajaA() {
      const el = document.getElementById('caja-view');
      const c = stateA.client;

      if (stateA.cajaMode === "SCAN_READY") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; font-size: 0.9rem;">Escanear Cliente</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Apuntá la cámara al QR de la tarjeta de WhatsApp</p>
            <div class="scanner-mock">
              <div class="scan-laser"></div>
              <div style="font-size: 1.5rem;">📷</div>
              <div>Cámara activa · Esperando código...</div>
            </div>
            <button class="btn btn-action" onclick="executeScanByStoryA()">
              [ Simular lectura de QR ]
            </button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "CLIENT_DETECTED") {
        let prizeAlert = '';
        let actionButtons = '';

        if (c.hasAvailablePrize) {
          prizeAlert = `
            <div class="alert-box success">
              🎁 <b>CLIENTE CON BENEFICIO DISPONIBLE</b><br>
              Tiene guardado: <b>Combo 15 Piezas Gratis</b> (<code>${c.prizeCode}</code>).
            </div>
          `;
          actionButtons = `
            <button class="btn btn-action" style="background: var(--success);" onclick="stateA.cajaMode = 'CANJE_CONFIRM'; renderA();">
              [ 1. Canjear Premio Hoy (Combo Gratis) ]
            </button>
            <button class="btn btn-action" style="margin-top: 4px;" onclick="sumarVisitaConservandoPremioA()">
              [ 2. Pagar normal y Sumar Visita (Guardar Premio) ]
            </button>
          `;
        } else {
          actionButtons = `
            <button class="btn btn-action" onclick="confirmarCompraA()">
              [ + SUMAR VISITA ]
            </button>
          `;
        }

        el.innerHTML = `
          <div class="card">
            <div style="font-size: 1.05rem; font-weight: 700;">${c.name}</div>
            <div class="metric-box">
              <span style="font-size: 0.78rem; color: var(--text-muted);">Estado:</span>
              <span style="font-size: 1.1rem; font-weight: 800; color: #f59e0b;">⭐ ${c.visits} / 8 visitas</span>
            </div>
            ${prizeAlert}
            ${actionButtons}
            <button class="btn btn-outline" style="margin-top: 4px;" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cancelar</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "PROCESSING") {
        el.innerHTML = `
          <div class="card" style="text-align: center; padding: 40px 14px;">
            <div style="font-size: 1.3rem;">⏳</div>
            <div style="font-weight: 700; margin: 10px 0 4px;">Registrando operación...</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Disparando notificación oficial a WhatsApp</p>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "SUCCESS_DONE") {
        el.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 1.4rem; color: var(--success);">✓</div>
            <div style="font-weight: 700; font-size: 1.05rem;">Visita Acreditada</div>
            <div style="font-size: 1.3rem; font-weight: 800; color: #56d364; margin: 6px 0;">⭐ ${c.visits} / 8</div>
            <button class="btn btn-action" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Nueva Venta</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "WARNING_QUICK_BUY") {
        el.innerHTML = `
          <div class="card">
            <div style="font-size: 1rem; font-weight: 700;">${c.name}</div>
            <div class="alert-box warn">
              <b>COMPRA RECIENTE (hace 30s)</b><br>¿Confirmar 2do ticket legítimo (take away)?
            </div>
            <button class="btn btn-action" onclick="confirmarCompraA()">[ SÍ, CONFIRMAR SEGUNDA COMPRA ]</button>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cancelar</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "CANJE_CONFIRM") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700;">Canje de Recompensa</div>
            <div class="alert-box success">Beneficio: <b>Combo 15 Piezas</b><br>Código: <code>${c.prizeCode}</code></div>
            <button class="btn btn-action" style="background: var(--success);" onclick="canjearA()">[ ENTREGAR Y QUEMAR CÓDIGO ]</button>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'CLIENT_DETECTED'; renderA();">Volver</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "CANJE_DONE") {
        el.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 1.4rem; color: var(--success);">✓</div>
            <div style="font-weight: 700;">Premio Entregado</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Código quemado. Tarjeta en 0/8.</p>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cámara Lista</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "REUSED_BLOCKED") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; color: var(--danger);">Rechazo de Canje</div>
            <div class="alert-box danger">PREMIO YA UTILIZADO el ${c.redeemedAt} por Caja 1.</div>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Volver a Cámara</button>
          </div>
        `;
        return;
      }
    }

    function executeScanByStoryA() {
      if (stateA.client.isReusedCodeAttempt) stateA.cajaMode = "REUSED_BLOCKED";
      else if (stateA.client.isImmediateSecondBuyStory) stateA.cajaMode = "WARNING_QUICK_BUY";
      else stateA.cajaMode = "CLIENT_DETECTED";
      renderA();
    }

    function confirmarCompraA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits++;
        const v = stateA.client.visits;
        stateA.cajaMode = "SUCCESS_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🎉 <b>¡Visita acreditada!</b><br>Tu tarjeta ahora está en <b>${v} / 8 ⭐</b>.`,
          snapshotVisits: v,
          time: "20:15"
        });
        renderA();
      }, 1000);
    }

    function sumarVisitaConservandoPremioA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits = 1;
        stateA.cajaMode = "SUCCESS_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🎉 <b>¡Visita acreditada!</b><br>Nuevo ciclo: <b>1 / 8 ⭐</b>.<br>🎁 Premio Combo 15p sigue guardado.`,
          snapshotVisits: 1,
          time: "20:25"
        });
        renderA();
      }, 1000);
    }

    function canjearA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits = 0;
        stateA.client.hasAvailablePrize = false;
        stateA.cajaMode = "CANJE_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🍣 <b>¡Premio entregado!</b><br>Combo 15p canjeado. Código quemado.<br>Nueva tarjeta en <b>0 / 8 ⭐</b>.`,
          snapshotVisits: 0,
          time: "21:10"
        });
        renderA();
      }, 1000);
    }

    function renderWhatsAppA() {
      const el = document.getElementById('wa-chat');
      let html = '';
      stateA.chatHistory.forEach(msg => {
        let stamps = '';
        for (let i = 1; i <= 8; i++) {
          const isFilled = i <= msg.snapshotVisits;
          const isPrize = i === 8;
          let cls = 'stamp';
          if (isPrize) cls += ' prize';
          if (isFilled) cls += ' active';
          stamps += `<div class="${cls}">${isPrize ? '🎁' : i}</div>`;
        }
        html += `
          <div class="wa-msg ${msg.type}">
            ${msg.text}
            <div class="stamps-box">
              <div style="font-size: 0.65rem; color: #8b949e; text-transform: uppercase;">Tarjeta Digital</div>
              <div class="grid-stamps">${stamps}</div>
              <div class="qr-client-img"><div class="qr-lines"></div></div>
              <div style="font-size: 0.65rem; color: #8b949e; margin-top: 3px;">Mostralo al pagar</div>
            </div>
            <div class="wa-time">${msg.time} ✓✓</div>
          </div>
        `;
      });
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    // ==========================================
    // LOGICA MODELO B: SISTEMA DE PUNTOS & ONBOARDING
    // ==========================================
    function startStoryB(storyId) {
      activeStoryB = storyId;

      if (storyId === 1) { // Caja rápida (DNI + Monto)
        stateB.viewMode = "CASH_REGISTER";
        stateB.client.points = 180;
        stateB.chatHistory = [{
          type: "recv",
          text: "¡Hola María! Sos socia del Club Sushi.<br>Tu saldo actual es de <b>180 Puntos</b>.<br>Te faltan 20 puntos para tu <b>Combo 15 Piezas Gratis</b>.",
          points: 180,
          time: "19:30"
        }];
      } else if (storyId === 2) { // Canje de puntos acumulados
        stateB.viewMode = "CANJE_READY";
        stateB.client.points = 210;
        stateB.chatHistory = [{
          type: "recv",
          text: "🎉 <b>¡Llegaste a la meta!</b><br>Tu saldo es de <b>210 Puntos</b>.<br>Ya podés canjear tu <b>Combo 15 Piezas Gratis (200 pts)</b>.",
          points: 210,
          time: "20:00"
        }];
      } else if (storyId === 3) { // Wizard Actuarial de Onboarding (Para el Dueño)
        stateB.viewMode = "ONBOARDING_WIZARD";
        stateB.chatHistory = [{
          type: "recv",
          text: "Vista previa de WhatsApp para clientes del negocio.",
          points: 0,
          time: "12:00"
        }];
      }

      renderControlsB();
      renderB();
    }

    function renderControlsB() {
      document.getElementById('controls-panel').innerHTML = `
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Vistas (Puntos):</span>
        <div class="controls-btns">
          <button class="btn-ctrl ${activeStoryB === 1 ? 'active' : ''}" onclick="startStoryB(1)">1. Caja: DNI + Monto ($12.000)</button>
          <button class="btn-ctrl ${activeStoryB === 2 ? 'active' : ''}" onclick="startStoryB(2)">2. Canje de Premio (200 pts)</button>
          <button class="btn-ctrl ${activeStoryB === 3 ? 'active' : ''}" onclick="startStoryB(3)">3. Wizard Onboarding (Dueño)</button>
        </div>
      `;
    }

    function renderB() {
      renderCajaB();
      renderWhatsAppB();
    }

    function renderCajaB() {
      const el = document.getElementById('caja-view');
      const c = stateB.client;
      const cfg = stateB.config;

      // 1. CAJA RÁPIDA: DNI + MONTO
      if (stateB.viewMode === "CASH_REGISTER") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; font-size: 0.9rem;">Acreditar Compra por Puntos</div>
            <p style="font-size: 0.74rem; color: var(--text-muted);">
              Fricción cero: Ingresá el DNI del cliente y el monto cobrado.
            </p>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted);">DNI del Cliente:</label>
              <input type="text" class="input-field" id="input-dni" value="38.123.456">
            </div>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted);">Monto del Ticket ($):</label>
              <input type="number" class="input-field" id="input-spend" value="12000" oninput="updateCalculatedPoints()">
            </div>

            <div class="metric-box">
              <span style="font-size: 0.78rem; color: var(--text-muted);">Puntos a generar ($1.000 = 1 pt):</span>
              <span style="font-size: 1.2rem; font-weight: 800; color: #56d364;" id="calc-pts">+12 pts</span>
            </div>

            <button class="btn btn-action" onclick="confirmarPuntosB()">
              [ ACREDITAR PUNTOS EN SEGUNDOS ]
            </button>
          </div>
        `;
        return;
      }

      // 2. CANJE DE PUNTOS
      if (stateB.viewMode === "CANJE_READY") {
        el.innerHTML = `
          <div class="card">
            <div style="font-size: 1.05rem; font-weight: 700;">${c.name}</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">DNI: ${c.dni}</div>

            <div class="metric-box">
              <span style="font-size: 0.78rem; color: var(--text-muted);">Saldo disponible:</span>
              <span style="font-size: 1.2rem; font-weight: 800; color: #56d364;">${c.points} Puntos</span>
            </div>

            <div class="alert-box success">
              🎁 <b>CANJE HABILITADO</b><br>
              Premio: <b>${cfg.prizeName}</b><br>
              Costo de canje: <b>${cfg.prizePoints} Puntos</b>
            </div>

            <button class="btn btn-action" style="background: var(--success);" onclick="ejecutarCanjePuntosB()">
              [ DESCONTAR 200 PTS Y ENTREGAR ]
            </button>
            <button class="btn btn-outline" onclick="startStoryB(1)">Volver a Cobro Normal</button>
          </div>
        `;
        return;
      }

      // 3. WIZARD ONBOARDING ACTUARIAL (Para el Dueño del local)
      if (stateB.viewMode === "ONBOARDING_WIZARD") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; font-size: 0.9rem;">Wizard Actuarial (Setup en 2 min)</div>
            <p style="font-size: 0.74rem; color: var(--text-muted);">
              El dueño no hace cuentas: el motor calcula el techo seguro (C_max).
            </p>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted);">Rubro del Comercio:</label>
              <select class="input-field" id="wizard-rubro" onchange="recalcWizard()">
                <option value="0.08" selected>Gastronomía (ΔQ conservador: 8%)</option>
                <option value="0.12">Servicios / Barbería (ΔQ: 12%)</option>
                <option value="0.05">Indumentaria / Retail (ΔQ: 5%)</option>
              </select>
            </div>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted);">Margen Bruto Estimado (%):</label>
              <input type="number" class="input-field" id="wizard-margin" value="65" oninput="recalcWizard()">
            </div>

            <div class="alert-box info" style="background: rgba(56, 139, 253, 0.1); border-left: 3px solid #388bfd; color: #79c0ff;">
              <b>Diagnóstico Actuarial:</b><br>
              • Techo máximo seguro (C_max): <b id="wiz-cmax">4.81%</b><br>
              • Retorno recomendado (s=0.7): <b id="wiz-crec">3.37%</b>
            </div>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted);">Precio de 1 Producto Insignia de Regalo ($):</label>
              <input type="number" class="input-field" id="wizard-anchor" value="10000" oninput="recalcWizard()">
            </div>

            <div class="metric-box">
              <span style="font-size: 0.75rem; color: var(--text-muted);">Regla calculada:</span>
              <span style="font-size: 0.85rem; font-weight: 700; color: #56d364;" id="wiz-rule">$1.000 = 1 pt (Premio: 200 pts)</span>
            </div>

            <button class="btn btn-action" onclick="saveWizardConfig()">
              [ APLICAR CONFIGURACIÓN AL NEGOCIO ]
            </button>
          </div>
        `;
        return;
      }

      // PROCESANDO
      if (stateB.viewMode === "PROCESSING") {
        el.innerHTML = `
          <div class="card" style="text-align: center; padding: 40px 14px;">
            <div style="font-size: 1.3rem;">⏳</div>
            <div style="font-weight: 700; margin: 10px 0 4px;">Acreditando puntos...</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Disparando saldo actualizado a WhatsApp</p>
          </div>
        `;
        return;
      }

      // ÉXITO
      if (stateB.viewMode === "SUCCESS") {
        el.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 1.4rem; color: var(--success);">✓</div>
            <div style="font-weight: 700; font-size: 1.05rem;">Operación Registrada</div>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin: 6px 0;">
              Se acreditaron <b>+${stateB.client.lastAddedPoints} puntos</b> por compra de <b>$${stateB.client.lastSpendAmount.toLocaleString('es-AR')}</b>.
            </p>
            <div style="font-size: 1.3rem; font-weight: 800; color: #56d364; margin: 8px 0;">
              Nuevo Saldo: ${stateB.client.points} Puntos
            </div>
            <button class="btn btn-action" onclick="stateB.viewMode = 'CASH_REGISTER'; renderB();">Nueva Venta</button>
          </div>
        `;
        return;
      }
    }

    function updateCalculatedPoints() {
      const spend = Number(document.getElementById('input-spend').value) || 0;
      const pts = Math.floor(spend / stateB.config.ratioSpend);
      document.getElementById('calc-pts').innerText = `+${pts} pts`;
    }

    function confirmarPuntosB() {
      const spend = Number(document.getElementById('input-spend').value) || 0;
      const pts = Math.floor(spend / stateB.config.ratioSpend);

      stateB.client.lastSpendAmount = spend;
      stateB.client.lastAddedPoints = pts;
      stateB.viewMode = "PROCESSING";
      renderB();

      setTimeout(() => {
        stateB.client.points += pts;
        stateB.viewMode = "SUCCESS";

        stateB.chatHistory.push({
          type: "recv",
          text: `🎉 <b>¡Sumaste ${pts} Puntos!</b><br>Por tu compra de $${spend.toLocaleString('es-AR')}.<br>Tu saldo actualizado es de <b>${stateB.client.points} Puntos</b>.<br>${stateB.client.points >= 200 ? '🎁 ¡Ya podés canjear tu Combo Gratis!' : 'Te faltan ' + (200 - stateB.client.points) + ' pts para tu premio.'}`,
          points: stateB.client.points,
          time: "20:30"
        });

        renderB();
      }, 1000);
    }

    function ejecutarCanjePuntosB() {
      stateB.viewMode = "PROCESSING";
      renderB();

      setTimeout(() => {
        stateB.client.points -= stateB.config.prizePoints;
        stateB.viewMode = "CASH_REGISTER";

        stateB.chatHistory.push({
          type: "recv",
          text: `🍣 <b>¡Canje realizado con éxito!</b><br>Utilizaste 200 puntos para tu <b>Combo 15 Piezas Gratis</b>.<br>Tu nuevo saldo restante es de <b>${stateB.client.points} Puntos</b>.`,
          points: stateB.client.points,
          time: "20:35"
        });

        renderB();
      }, 1000);
    }

    function recalcWizard() {
      const dq = Number(document.getElementById('wizard-rubro').value);
      const m = (Number(document.getElementById('wizard-margin').value) || 65) / 100;
      const cmax = (m * dq) / (1 + dq);
      const crec = cmax * 0.70;

      document.getElementById('wiz-cmax').innerText = `${(cmax * 100).toFixed(2)}%`;
      document.getElementById('wiz-crec').innerText = `${(crec * 100).toFixed(2)}%`;
    }

    function saveWizardConfig() {
      alert("¡Configuración actuarial guardada! El motor aplicó la regla $1.000 = 1 punto con premio de 200 puntos sin riesgo de quiebre.");
      startStoryB(1);
    }

    function renderWhatsAppB() {
      const el = document.getElementById('wa-chat');
      let html = '';
      stateB.chatHistory.forEach(msg => {
        html += `
          <div class="wa-msg ${msg.type}">
            ${msg.text}
            <div class="points-badge">
              <div style="font-size: 0.65rem; color: #8b949e; text-transform: uppercase;">Club Sushi Puntos</div>
              <div class="points-val">${msg.points} PTS</div>
              <div class="qr-client-img"><div class="qr-lines"></div></div>
              <div style="font-size: 0.65rem; color: #8b949e; margin-top: 3px;">Mostrá tu QR o decí tu DNI en caja</div>
            </div>
            <div class="wa-time">${msg.time} ✓✓</div>
          </div>
        `;
      });
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    // Inicializar en Sellos
    switchSystemMode('SELLOS');
  </script>
</body>
</html>
