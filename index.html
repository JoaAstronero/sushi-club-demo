<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi Club — Simulación de Modelos Loyalty</title>
  <style>
    :root {
      --bg: #090b0e;
      --panel: #12161f;
      --border: #232836;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #e04a3f;
      --accent-hover: #c7382d;
      --success: #238636;
      --warning: #d29922;
      --danger: #f85149;
      --wa-bg: #0b141a;
      --wa-bubble-me: #005c4b;
      --wa-bubble-sys: #202c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px;
    }

    /* SELECTOR DE ENFOQUE (MODELO A vs MODELO B) */
    .system-selector {
      width: 100%;
      max-width: 860px;
      background: #11151f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .sys-tab {
      flex: 1;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .sys-tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.02);
    }

    .sys-tab.active {
      background: #1c2230;
      border-color: #3b455b;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .top-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar h1 {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .workspace {
      display: flex;
      gap: 18px;
      width: 100%;
      max-width: 860px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .screen-col {
      flex: 1;
      min-width: 320px;
      max-width: 410px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .device {
      height: 620px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
      position: relative;
    }

    /* CAJA TERMINAL */
    .caja-top {
      padding: 12px 16px;
      background: #0d0f15;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }

    .status-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .dot-active {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    .caja-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .card {
      background: #171b26;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scanner-mock {
      background: #0d0f15;
      border: 2px dashed #2d3546;
      border-radius: 10px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    .scan-laser {
      position: absolute;
      top: 20%;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: laserMove 2.5s infinite ease-in-out;
    }

    @keyframes laserMove {
      0%, 100% { top: 15%; opacity: 0.4; }
      50% { top: 85%; opacity: 1; }
    }

    .metric-box {
      background: #0d0f15;
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-field {
      width: 100%;
      padding: 10px 12px;
      background: #0d0f15;
      border: 1px solid #283044;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .slider-range {
      width: 100%;
      margin: 8px 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .btn-outline:hover {
      color: var(--text);
      border-color: #3f475a;
    }

    .alert-box {
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .alert-box.warn {
      background: rgba(210, 153, 34, 0.12);
      border-left: 3px solid var(--warning);
      color: #e3b341;
    }

    .alert-box.danger {
      background: rgba(248, 81, 73, 0.12);
      border-left: 3px solid var(--danger);
      color: #ff7b72;
    }

    .alert-box.success {
      background: rgba(35, 134, 54, 0.12);
      border-left: 3px solid var(--success);
      color: #56d364;
    }

    .alert-box.info {
      background: rgba(56, 139, 253, 0.1);
      border-left: 3px solid #388bfd;
      color: #79c0ff;
    }

    /* WHATSAPP CLIENTE */
    .wa-top {
      padding: 12px 14px;
      background: #202c33;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    .wa-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .wa-chat {
      flex: 1;
      background: var(--wa-bg);
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wa-msg {
      max-width: 88%;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.35;
      animation: msgPop 0.25s ease-out;
    }

    @keyframes msgPop {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .wa-msg.sent {
      background: var(--wa-bubble-me);
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .wa-msg.recv {
      background: var(--wa-bubble-sys);
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .wa-time {
      font-size: 0.62rem;
      color: rgba(255,255,255,0.45);
      text-align: right;
      margin-top: 3px;
    }

    /* Sellos Modelo A */
    .stamps-box {
      background: #11141c;
      border: 1px solid #283042;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      text-align: center;
    }

    .grid-stamps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin: 8px 0;
    }

    .stamp {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px dashed #3a445b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: #64748b;
    }

    .stamp.active {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-weight: bold;
    }

    .stamp.prize {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    .stamp.prize.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }

    /* Puntos Modelo B */
    .points-badge {
      background: #11141c;
      border: 1px solid #283042;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      text-align: center;
    }

    .points-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: #56d364;
      margin: 4px 0;
    }

    .qr-client-img {
      width: 70px;
      height: 70px;
      background: #fff;
      margin: 6px auto 2px;
      border-radius: 4px;
      padding: 4px;
    }

    .qr-lines {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, #111, #111 4px, #fff 4px, #fff 8px);
    }

    /* CONTROLES INFERIORES */
    .controls-panel {
      width: 100%;
      max-width: 860px;
      margin-top: 14px;
      background: #10131b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-ctrl {
      background: #171b26;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.74rem;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-ctrl:hover {
      color: var(--text);
      border-color: #3b455b;
    }

    .btn-ctrl.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- SELECTOR DE MODELO DE NEGOCIO -->
  <div class="system-selector">
    <button class="sys-tab" id="tab-model-a" onclick="switchSystemMode('SELLOS')">
      Modelo A: Tarjeta de Sellos (Visitas 1/8)
    </button>
    <button class="sys-tab active" id="tab-model-b" onclick="switchSystemMode('PUNTOS')">
      Modelo B: Sistema de Puntos ($ / Puntos + Configuración)
    </button>
  </div>

  <div class="top-bar">
    <h1 id="top-title">SUSHI CLUB · SISTEMA DE PUNTOS</h1>
    <div style="font-size: 0.72rem; color: var(--text-muted);" id="top-sub">
      Configuración segura para el dueño + Caja en segundos
    </div>
  </div>

  <div class="workspace">
    
    <!-- COLUMNA 1: TERMINAL CAJA / CONFIGURACIÓN -->
    <div class="screen-col">
      <div class="col-label">
        <span id="col1-title">Configuración del Dueño</span>
        <span id="col1-role">Paso 1: Setup</span>
      </div>
      <div class="device">
        <div class="caja-top">
          <span style="font-weight: 700;" id="caja-brand-title">SUSHI CLUB</span>
          <span class="status-tag" id="caja-status-tag"><span class="dot-active"></span>Configuración Activa</span>
        </div>
        
        <div class="caja-body" id="caja-view">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

    <!-- COLUMNA 2: WHATSAPP DEL CLIENTE -->
    <div class="screen-col">
      <div class="col-label">
        <span>Celular del Cliente</span>
        <span>Canal: WhatsApp</span>
      </div>
      <div class="device">
        <div class="wa-top">
          <div class="wa-avatar">🍣</div>
          <div>
            <div style="font-weight: 700;">Sushi Club Oficial</div>
            <div style="font-size: 0.65rem; color: #8696a0;">Cuenta comercial verificada</div>
          </div>
        </div>
        
        <div class="wa-chat" id="wa-chat">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

  </div>

  <!-- PANEL DE HISTORIAS INFERIOR -->
  <div class="controls-panel" id="controls-panel">
    <!-- Se inyecta según Modelo A o Modelo B -->
  </div>

  <script>
    let currentSystem = 'PUNTOS'; // Default en Puntos

    // ==========================================
    // ESTADO PARA MODELO A (SELLOS / VISITAS)
    // ==========================================
    let activeStoryA = 1;
    const stateA = {
      cajaMode: "SCAN_READY",
      client: {
        name: "María González",
        phone: "+54 9 351 512-3456",
        visits: 3,
        max: 8,
        hasAvailablePrize: false,
        prizeCode: "SUSHI-8X91B",
        redeemedAt: null,
        isReusedCodeAttempt: false,
        isImmediateSecondBuyStory: false
      },
      chatHistory: []
    };

    // ==========================================
    // ESTADO PARA MODELO B (SISTEMA DE PUNTOS)
    // ==========================================
    let activeStoryB = 1; // 1: Setup Dueño, 2: Caja DNI+Monto, 3: Canje
    const stateB = {
      viewMode: "ONBOARDING_SETUP", // ONBOARDING_SETUP | CASH_REGISTER | CANJE_READY | PROCESSING | SUCCESS
      config: {
        ratioSpend: 1000, // Cada $1000 = 1 punto
        anchorPrice: 10000,
        prizePoints: 200,
        prizeName: "Combo 15 Piezas Gratis",
        sliderAggressiveness: 70, // 50: Conservador, 70: Recomendado, 100: Generoso
        marginLevel: 0.65,
        maxSafePercent: 4.8,
        recommendedPercent: 3.4
      },
      client: {
        dni: "38.123.456",
        name: "María González",
        phone: "+54 9 351 512-3456",
        points: 180,
        lastAddedPoints: 0,
        lastSpendAmount: 0
      },
      chatHistory: []
    };

    function switchSystemMode(mode) {
      currentSystem = mode;
      document.getElementById('tab-model-a').classList.toggle('active', mode === 'SELLOS');
      document.getElementById('tab-model-b').classList.toggle('active', mode === 'PUNTOS');

      if (mode === 'SELLOS') {
        document.getElementById('top-title').innerText = "SUSHI CLUB · SIMULACIÓN OPERATIVA (SELLOS)";
        document.getElementById('top-sub').innerText = "Flujo reactivo: Terminal de Caja ⇄ WhatsApp";
        document.getElementById('col1-title').innerText = "Terminal del Comercio";
        document.getElementById('col1-role').innerText = "Rol: Cajero";
        startStoryA(activeStoryA);
      } else {
        document.getElementById('top-title').innerText = "SUSHI CLUB · SISTEMA DE PUNTOS";
        document.getElementById('top-sub').innerText = "Configuración segura para el dueño + Caja en segundos";
        startStoryB(activeStoryB);
      }
    }

    // ==========================================
    // LOGICA MODELO B: PUNTOS REDISEÑADO
    // ==========================================
    function startStoryB(stepId) {
      activeStoryB = stepId;

      if (stepId === 1) { // 1. Configuración del Dueño (Setup en 2 minutos)
        stateB.viewMode = "ONBOARDING_SETUP";
        document.getElementById('col1-title').innerText = "Configuración del Dueño";
        document.getElementById('col1-role').innerText = "Paso 1: Setup";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Configuración Activa';

        stateB.chatHistory = [{
          type: "recv",
          text: `¡Hola María! Ya sos parte del Club.<br>Tu saldo inicial es de <b>0 Puntos</b>.<br>Sumás 1 punto cada <b>$${stateB.config.ratioSpend.toLocaleString('es-AR')}</b> gastados.<br>Premio: <b>${stateB.config.prizeName}</b> (${stateB.config.prizePoints} pts).`,
          points: 0,
          time: "19:00"
        }];
      } 
      else if (stepId === 2) { // 2. Caja rápida (DNI + Monto)
        stateB.viewMode = "CASH_REGISTER";
        document.getElementById('col1-title').innerText = "Terminal de Caja";
        document.getElementById('col1-role').innerText = "Paso 2: Operación";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Caja 1 · Activa';

        stateB.client.points = 180;
        stateB.chatHistory = [{
          type: "recv",
          text: `¡Hola María! Tenés <b>180 Puntos</b> acumulados.<br>Faltan 20 puntos para tu <b>${stateB.config.prizeName}</b>.`,
          points: 180,
          time: "19:30"
        }];
      } 
      else if (stepId === 3) { // 3. Canje de Recompensa
        stateB.viewMode = "CANJE_READY";
        document.getElementById('col1-title').innerText = "Terminal de Caja";
        document.getElementById('col1-role').innerText = "Paso 3: Canje";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Caja 1 · Activa';

        stateB.client.points = 210;
        stateB.chatHistory = [{
          type: "recv",
          text: `🎉 <b>¡Llegaste a la meta María!</b><br>Tenés <b>210 Puntos</b> disponibles.<br>Ya podés canjear tu <b>${stateB.config.prizeName} (${stateB.config.prizePoints} pts)</b> en caja.`,
          points: 210,
          time: "20:00"
        }];
      }

      renderControlsB();
      renderB();
    }

    function renderControlsB() {
      document.getElementById('controls-panel').innerHTML = `
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Flujo de Venta (Puntos):</span>
        <div class="controls-btns">
          <button class="btn-ctrl ${activeStoryB === 1 ? 'active' : ''}" onclick="startStoryB(1)">1. Configurar (Dueño)</button>
          <button class="btn-ctrl ${activeStoryB === 2 ? 'active' : ''}" onclick="startStoryB(2)">2. Caja (DNI + Monto)</button>
          <button class="btn-ctrl ${activeStoryB === 3 ? 'active' : ''}" onclick="startStoryB(3)">3. Canje de Premio</button>
        </div>
      `;
    }

    function renderB() {
      renderCajaB();
      renderWhatsAppB();
    }

    function renderCajaB() {
      const el = document.getElementById('caja-view');
      const c = stateB.client;
      const cfg = stateB.config;

      // 1. CONFIGURACIÓN DEL DUEÑO (CERO JERGA)
      if (stateB.viewMode === "ONBOARDING_SETUP") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; font-size: 0.92rem;">Configurá tu Programa en 2 minutos</div>
            <p style="font-size: 0.74rem; color: var(--text-muted);">
              Te decimos exactamente cuánto podés regalar para ganar clientes sin arriesgar tu ganancia.
            </p>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">Rubro de tu Negocio:</label>
              <select class="input-field" id="cfg-rubro" onchange="updateSetupMath()">
                <option value="0.08" selected>Gastronomía (Restaurante, Sushi, Café)</option>
                <option value="0.12">Servicios (Barbería, Estética, Lavadero)</option>
                <option value="0.05">Comercio / Tienda de Ropa</option>
              </select>
            </div>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">Nivel de Margen de Ganancia:</label>
              <select class="input-field" id="cfg-margin-level" onchange="updateSetupMath()">
                <option value="0.50">Normal (Aprox 50%)</option>
                <option value="0.65" selected>Alto gastronómico (Aprox 65%)</option>
                <option value="0.75">Muy alto / Especialidad (Aprox 75%)</option>
              </select>
            </div>

            <div>
              <div style="display: flex; justify-content: space-between; font-size: 0.72rem;">
                <span style="color: var(--text-muted); font-weight: 600;">Estrategia de Beneficio:</span>
                <span style="font-weight: 700; color: #56d364;" id="label-slider-mode">Recomendada (3.4% retorno)</span>
              </div>
              <input type="range" class="slider-range" id="cfg-slider" min="50" max="100" value="70" step="10" oninput="updateSetupMath()">
              <div style="display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted);">
                <span>Conservadora</span>
                <span>Equilibrada</span>
                <span>Generosa</span>
              </div>
            </div>

            <div class="alert-box info" style="font-size: 0.76rem;">
              <b>Resultado Seguro:</b><br>
              Podés regalar hasta <b id="txt-cmax">4.8%</b> de tus ventas sin arriesgar margen.<br>
              Te sugerimos empezar en <b id="txt-crec" style="color: #56d364;">3.4%</b> para tener un colchón de seguridad.
            </div>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">¿Qué premio querés regalar a clientes fieles?</label>
              <div style="display: flex; gap: 6px; margin-top: 4px;">
                <input type="text" class="input-field" style="flex: 2;" id="cfg-prizename" value="Combo 15 Piezas">
                <input type="number" class="input-field" style="flex: 1;" id="cfg-prizeprice" value="10000" oninput="updateSetupMath()" title="Precio aproximado de venta">
              </div>
            </div>

            <div class="metric-box" style="margin-top: 2px;">
              <span style="font-size: 0.75rem; color: var(--text-muted);">Regla generada:</span>
              <span style="font-size: 0.85rem; font-weight: 700; color: #56d364;" id="txt-final-rule">
                $1.000 = 1 pt · Premio: 200 pts
              </span>
            </div>

            <button class="btn btn-action" onclick="applySetupAndGoToCashier()">
              [ APLICAR Y PROBAR COBRO EN CAJA → ]
            </button>
          </div>
        `;
        return;
      }

      // 2. CAJA RÁPIDA (CONEXIÓN VIVA CON EL PASO 1)
      if (stateB.viewMode === "CASH_REGISTER") {
        el.innerHTML = `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-weight: 700; font-size: 0.9rem;">Cobro y Acreditación de Puntos</span>
              <span style="font-size: 0.68rem; background: #1c2230; padding: 2px 6px; border-radius: 4px; color: #56d364;">
                Regla: $${cfg.ratioSpend.toLocaleString('es-AR')} = 1 pt
              </span>
            </div>
            
            <p style="font-size: 0.74rem; color: var(--text-muted);">
              El cajero solo escribe el DNI y el monto del ticket.
            </p>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted);">DNI del Cliente:</label>
              <input type="text" class="input-field" id="input-dni" value="${c.dni}">
            </div>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted);">Monto del Ticket ($):</label>
              <input type="number" class="input-field" id="input-spend" value="12000" oninput="updateCalculatedPointsLive()">
            </div>

            <div class="metric-box">
              <span style="font-size: 0.78rem; color: var(--text-muted);">Puntos calculados automáticamente:</span>
              <span style="font-size: 1.25rem; font-weight: 800; color: #56d364;" id="calc-pts">+12 pts</span>
            </div>

            <button class="btn btn-action" onclick="confirmarPuntosB()">
              [ ACREDITAR PUNTOS EN SEGUNDOS ]
            </button>
            <button class="btn btn-outline" onclick="startStoryB(1)">← Volver a Modificar Configuración</button>
          </div>
        `;
        return;
      }

      // 3. CANJE DE PUNTOS
      if (stateB.viewMode === "CANJE_READY") {
        el.innerHTML = `
          <div class="card">
            <div style="font-size: 1.05rem; font-weight: 700;">${c.name}</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">DNI: ${c.dni}</div>

            <div class="metric-box">
              <span style="font-size: 0.78rem; color: var(--text-muted);">Saldo disponible:</span>
              <span style="font-size: 1.2rem; font-weight: 800; color: #56d364;">${c.points} Puntos</span>
            </div>

            <div class="alert-box success">
              🎁 <b>BENEFICIO DISPONIBLE PARA CANJEAR</b><br>
              Premio: <b>${cfg.prizeName}</b><br>
              Costo de canje: <b>${cfg.prizePoints} Puntos</b>
            </div>

            <button class="btn btn-action" style="background: var(--success);" onclick="ejecutarCanjePuntosB()">
              [ DESCONTAR ${cfg.prizePoints} PTS Y ENTREGAR COMBO ]
            </button>
            <button class="btn btn-outline" onclick="startStoryB(2)">Volver a Cobro de Caja</button>
          </div>
        `;
        return;
      }

      // PROCESANDO
      if (stateB.viewMode === "PROCESSING") {
        el.innerHTML = `
          <div class="card" style="text-align: center; padding: 40px 14px;">
            <div style="font-size: 1.3rem;">⏳</div>
            <div style="font-weight: 700; margin: 10px 0 4px;">Acreditando puntos...</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Disparando saldo actualizado a WhatsApp</p>
          </div>
        `;
        return;
      }

      // ÉXITO
      if (stateB.viewMode === "SUCCESS") {
        el.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 1.4rem; color: var(--success);">✓</div>
            <div style="font-weight: 700; font-size: 1.05rem;">Operación Registrada</div>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin: 6px 0;">
              Se acreditaron <b>+${stateB.client.lastAddedPoints} puntos</b> por compra de <b>$${stateB.client.lastSpendAmount.toLocaleString('es-AR')}</b>.
            </p>
            <div style="font-size: 1.3rem; font-weight: 800; color: #56d364; margin: 8px 0;">
              Nuevo Saldo: ${stateB.client.points} Puntos
            </div>
            <button class="btn btn-action" onclick="stateB.viewMode = 'CASH_REGISTER'; renderB();">Nueva Venta</button>
          </div>
        `;
        return;
      }
    }

    function updateSetupMath() {
      const dq = Number(document.getElementById('cfg-rubro').value);
      const m = Number(document.getElementById('cfg-margin-level').value);
      const sliderVal = Number(document.getElementById('cfg-slider').value);
      const prizePrice = Number(document.getElementById('cfg-prizeprice').value) || 10000;

      const cmax = (m * dq) / (1 + dq);
      const s = sliderVal / 100;
      const crec = cmax * s;

      stateB.config.maxSafePercent = (cmax * 100).toFixed(1);
      stateB.config.recommendedPercent = (crec * 100).toFixed(1);

      document.getElementById('txt-cmax').innerText = `${stateB.config.maxSafePercent}%`;
      document.getElementById('txt-crec').innerText = `${stateB.config.recommendedPercent}%`;

      let modeTxt = "Equilibrada";
      if (sliderVal <= 50) modeTxt = "Conservadora";
      else if (sliderVal >= 90) modeTxt = "Generosa";
      document.getElementById('label-slider-mode').innerText = `${modeTxt} (${stateB.config.recommendedPercent}% retorno)`;

      // Regla intuitiva: redondeo limpio
      let spendForPoint = 1000;
      if (prizePrice <= 5000) spendForPoint = 500;
      else if (prizePrice >= 20000) spendForPoint = 2000;

      const totalSpendTarget = Math.round(prizePrice / (crec / 0.70));
      const targetPoints = Math.round(totalSpendTarget / spendForPoint);

      stateB.config.ratioSpend = spendForPoint;
      stateB.config.prizePoints = targetPoints > 0 ? targetPoints : 100;
      stateB.config.anchorPrice = prizePrice;
      stateB.config.prizeName = document.getElementById('cfg-prizename').value || "Premio";

      document.getElementById('txt-final-rule').innerText = 
        `$${spendForPoint.toLocaleString('es-AR')} = 1 pt · Premio: ${stateB.config.prizePoints} pts`;
    }

    function applySetupAndGoToCashier() {
      updateSetupMath();
      startStoryB(2); // Salta a Caja
    }

    function updateCalculatedPointsLive() {
      const spend = Number(document.getElementById('input-spend').value) || 0;
      const pts = Math.floor(spend / stateB.config.ratioSpend);
      document.getElementById('calc-pts').innerText = `+${pts} pts`;
    }

    function confirmarPuntosB() {
      const spend = Number(document.getElementById('input-spend').value) || 0;
      const pts = Math.floor(spend / stateB.config.ratioSpend);

      stateB.client.lastSpendAmount = spend;
      stateB.client.lastAddedPoints = pts;
      stateB.viewMode = "PROCESSING";
      renderB();

      setTimeout(() => {
        stateB.client.points += pts;
        stateB.viewMode = "SUCCESS";

        stateB.chatHistory.push({
          type: "recv",
          text: `🎉 <b>¡Sumaste ${pts} Puntos!</b><br>Por tu compra de $${spend.toLocaleString('es-AR')}.<br>Tu saldo actualizado es de <b>${stateB.client.points} Puntos</b>.<br>${stateB.client.points >= stateB.config.prizePoints ? '🎁 ¡Ya podés canjear tu ' + stateB.config.prizeName + '!' : 'Te faltan ' + (stateB.config.prizePoints - stateB.client.points) + ' pts para tu premio.'}`,
          points: stateB.client.points,
          time: "20:30"
        });

        renderB();
      }, 1000);
    }

    function ejecutarCanjePuntosB() {
      stateB.viewMode = "PROCESSING";
      renderB();

      setTimeout(() => {
        stateB.client.points -= stateB.config.prizePoints;
        stateB.viewMode = "CASH_REGISTER";

        stateB.chatHistory.push({
          type: "recv",
          text: `🍣 <b>¡Canje realizado con éxito!</b><br>Utilizaste ${stateB.config.prizePoints} puntos para tu <b>${stateB.config.prizeName}</b>.<br>Tu nuevo saldo restante es de <b>${stateB.client.points} Puntos</b>.`,
          points: stateB.client.points,
          time: "20:35"
        });

        renderB();
      }, 1000);
    }

    function renderWhatsAppB() {
      const el = document.getElementById('wa-chat');
      let html = '';
      stateB.chatHistory.forEach(msg => {
        html += `
          <div class="wa-msg ${msg.type}">
            ${msg.text}
            <div class="points-badge">
              <div style="font-size: 0.65rem; color: #8b949e; text-transform: uppercase;">Club Sushi Puntos</div>
              <div class="points-val">${msg.points} PTS</div>
              <div class="qr-client-img"><div class="qr-lines"></div></div>
              <div style="font-size: 0.65rem; color: #8b949e; margin-top: 3px;">Mostrá tu QR o decí tu DNI en caja</div>
            </div>
            <div class="wa-time">${msg.time} ✓✓</div>
          </div>
        `;
      });
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    // Inicializar directamente en Modelo B
    switchSystemMode('PUNTOS');
  </script>
</body>
</html>
