<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi Club — Simulación de Modelos Loyalty</title>
  <style>
    :root {
      --bg: #090b0e;
      --panel: #12161f;
      --border: #232836;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #e04a3f;
      --accent-hover: #c7382d;
      --success: #238636;
      --warning: #d29922;
      --danger: #f85149;
      --wa-bg: #0b141a;
      --wa-bubble-me: #005c4b;
      --wa-bubble-sys: #202c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px;
    }

    .system-selector {
      width: 100%;
      max-width: 860px;
      background: #11151f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .sys-tab {
      flex: 1;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .sys-tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.02);
    }

    .sys-tab.active {
      background: #1c2230;
      border-color: #3b455b;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .top-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar h1 {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .workspace {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 980px;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
    }

    .screen-col {
      flex: 1;
      min-width: 320px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .device {
      min-height: 590px;
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
      position: relative;
    }

    /* CAJA TERMINAL */
    .caja-top {
      padding: 12px 16px;
      background: #0d0f15;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }

    .status-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .dot-active {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    .caja-body {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
    }

    .card {
      background: #171b26;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .scanner-mock {
      background: #0d0f15;
      border: 2px dashed #2d3546;
      border-radius: 10px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    .scan-laser {
      position: absolute;
      top: 20%;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: laserMove 2.5s infinite ease-in-out;
    }

    @keyframes laserMove {
      0%, 100% { top: 15%; opacity: 0.4; }
      50% { top: 85%; opacity: 1; }
    }

    .metric-box {
      background: #0d0f15;
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-field {
      width: 100%;
      padding: 9px 11px;
      background: #0d0f15;
      border: 1px solid #283044;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.83rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .slider-range {
      width: 100%;
      margin: 6px 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .btn-outline:hover {
      color: var(--text);
      border-color: #3f475a;
    }

    .alert-box {
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .alert-box.warn {
      background: rgba(210, 153, 34, 0.12);
      border-left: 3px solid var(--warning);
      color: #e3b341;
    }

    .alert-box.danger {
      background: rgba(248, 81, 73, 0.12);
      border-left: 3px solid var(--danger);
      color: #ff7b72;
    }

    .alert-box.success {
      background: rgba(35, 134, 54, 0.12);
      border-left: 3px solid var(--success);
      color: #56d364;
    }

    .alert-box.info {
      background: rgba(56, 139, 253, 0.1);
      border-left: 3px solid #388bfd;
      color: #79c0ff;
    }

    /* Multi-Premios Lista */
    .prize-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .prize-row {
      background: #0d0f15;
      border: 1px solid #232838;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
    }

    .prize-badge {
      background: #1c2230;
      color: #56d364;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
    }

    /* WHATSAPP CLIENTE */
    .wa-top {
      padding: 12px 14px;
      background: #202c33;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    .wa-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .wa-chat {
      flex: 1;
      background: var(--wa-bg);
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wa-msg {
      max-width: 88%;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.35;
      animation: msgPop 0.25s ease-out;
    }

    @keyframes msgPop {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .wa-msg.sent {
      background: var(--wa-bubble-me);
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .wa-msg.recv {
      background: var(--wa-bubble-sys);
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .wa-time {
      font-size: 0.62rem;
      color: rgba(255,255,255,0.45);
      text-align: right;
      margin-top: 3px;
    }

    /* Puntos Modelo B */
    .points-badge {
      background: #11141c;
      border: 1px solid #283042;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      text-align: center;
    }

    .points-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: #56d364;
      margin: 4px 0;
    }

    .qr-client-img {
      width: 70px;
      height: 70px;
      background: #fff;
      margin: 6px auto 2px;
      border-radius: 4px;
      padding: 4px;
    }

    .qr-lines {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, #111, #111 4px, #fff 4px, #fff 8px);
    }

    /* Sellos Modelo A */
    .stamps-box {
      background: #11141c;
      border: 1px solid #283042;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      text-align: center;
    }

    .grid-stamps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin: 8px 0;
    }

    .stamp {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px dashed #3a445b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: #64748b;
    }

    .stamp.active {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-weight: bold;
    }

    .stamp.prize {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    .stamp.prize.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }

    /* CONTROLES INFERIORES */
    .controls-panel {
      width: 100%;
      max-width: 860px;
      margin-top: 14px;
      background: #10131b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-ctrl {
      background: #171b26;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.74rem;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-ctrl:hover {
      color: var(--text);
      border-color: #3b455b;
    }

    .btn-ctrl.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- SELECTOR DE MODELO DE NEGOCIO -->
  <div class="system-selector">
    <button class="sys-tab" id="tab-model-a" onclick="switchSystemMode('SELLOS')">
      Modelo A: Tarjeta de Sellos (Visitas 1/8)
    </button>
    <button class="sys-tab active" id="tab-model-b" onclick="switchSystemMode('PUNTOS')">
      Modelo B: Sistema de Puntos ($ / Puntos + Configuración)
    </button>
  </div>

  <div class="top-bar">
    <h1 id="top-title">SUSHI CLUB · SISTEMA DE PUNTOS</h1>
    <div style="font-size: 0.72rem; color: var(--text-muted);" id="top-sub">
      Beneficios en % auto-indexados a inflación + Caja en segundos
    </div>
  </div>

  <div class="workspace">
    
    <!-- COLUMNA 1: TERMINAL CAJA / CONFIGURACIÓN -->
    <div class="screen-col">
      <div class="col-label">
        <span id="col1-title">Configuración del Dueño</span>
        <span id="col1-role">Paso 1: Setup</span>
      </div>
      <div class="device">
        <div class="caja-top">
          <span style="font-weight: 700;" id="caja-brand-title">SUSHI CLUB</span>
          <span class="status-tag" id="caja-status-tag"><span class="dot-active"></span>Configuración Activa</span>
        </div>
        
        <div class="caja-body" id="caja-view">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

    <!-- COLUMNA 2: WHATSAPP DEL CLIENTE -->
    <div class="screen-col">
      <div class="col-label">
        <span id="col2-title">Celular del Cliente</span>
        <span id="col2-role">Canal: WhatsApp</span>
      </div>
      <div class="device" id="device-col2">
        <div id="col2-header">
          <div class="wa-top">
            <div class="wa-avatar">🍣</div>
            <div>
              <div style="font-weight: 700;">Sushi Club Oficial</div>
              <div style="font-size: 0.65rem; color: #8696a0;">Cuenta comercial verificada</div>
            </div>
          </div>
        </div>
        
        <div id="col2-body" style="flex:1; display:flex; flex-direction:column; overflow-y:auto;">
          <div class="wa-chat" id="wa-chat">
            <!-- Render dinámico -->
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- PANEL DE HISTORIAS INFERIOR -->
  <div class="controls-panel" id="controls-panel">
    <!-- Se inyecta según Modelo A o Modelo B -->
  </div>

  <script>
    let currentSystem = 'PUNTOS';

    // ==========================================
    // ESTADO MODELO B: PUNTOS CON PREMIO % DEFAULT Y ENDOWED PROGRESS
    // ==========================================
    let activeStoryB = 1;
    const stateB = {
      viewMode: "ONBOARDING_SETUP",
      config: {
        ratioSpend: 1000, // Cada $1000 = 1 punto
        vPuntoMax: 34,
        marginPercent: 65,
        deltaQ: 0.08,
        sliderFactor: 0.70,
        maxSafePercent: 4.8,
        recommendedPercent: 3.4,
        activePrizeIndex: 0,
        // Catálogo configurable con precios de carta (PVP) y topes de seguridad
        prizes: [
          { id: 0, name: "50% OFF en tu Combo Favorito", type: "PERCENT_CAP", retailPrice: 14000, worstCaseCost: 7000, points: 210, isDefault: true },
          { id: 1, name: "Combo 15 Piezas Gratis", type: "FIXED", retailPrice: 10000, worstCaseCost: 10000, points: 300, isDefault: false },
          { id: 2, name: "Postre o Roll chico", type: "FIXED", retailPrice: 3500, worstCaseCost: 3500, points: 110, isDefault: false }
        ]
      },
      client: {
        dni: "38.123.456",
        name: "María González",
        phone: "+54 9 351 512-3456",
        points: 150,
        lastAddedPoints: 0,
        lastSpendAmount: 0
      },
      chatHistory: []
    };

    function switchSystemMode(mode) {
      currentSystem = mode;
      document.getElementById('tab-model-a').classList.toggle('active', mode === 'SELLOS');
      document.getElementById('tab-model-b').classList.toggle('active', mode === 'PUNTOS');

      if (mode === 'SELLOS') {
        document.getElementById('top-title').innerText = "SUSHI CLUB · SIMULACIÓN OPERATIVA (SELLOS)";
        document.getElementById('top-sub').innerText = "Flujo reactivo: Terminal de Caja ⇄ WhatsApp";
        document.getElementById('col1-title').innerText = "Terminal del Comercio";
        document.getElementById('col1-role').innerText = "Rol: Cajero";
        const headerEl = document.getElementById('col2-header');
        if (headerEl) {
          headerEl.innerHTML = `
            <div class="wa-top">
              <div class="wa-avatar">🍣</div>
              <div>
                <div style="font-weight: 700;">Sushi Club Oficial</div>
                <div style="font-size: 0.65rem; color: #8696a0;">Cuenta comercial verificada</div>
              </div>
            </div>
          `;
        }
        const bodyEl = document.getElementById('col2-body');
        if (bodyEl) {
          bodyEl.innerHTML = `<div class="wa-chat" id="wa-chat"></div>`;
        }
        startStoryA(1);
      } else {
        document.getElementById('top-title').innerText = "SUSHI CLUB · SISTEMA DE PUNTOS";
        document.getElementById('top-sub').innerText = "Beneficios en % auto-indexados a inflación + Caja en segundos";
        startStoryB(activeStoryB);
      }
    }

    function startStoryB(stepId) {
      activeStoryB = stepId;

      if (stepId === 1) { // 1. Configuración Dueño
        stateB.viewMode = "ONBOARDING_SETUP";
        document.getElementById('col1-title').innerText = "Configuración del Dueño";
        document.getElementById('col1-role').innerText = "Paso 1: Setup";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Configuración Activa';

        stateB.chatHistory = [{
          type: "recv",
          text: `¡Hola María! Ya sos parte del Club Sushi.<br>Tu saldo inicial incluye un <b>Bono de Bienvenida de 20 Puntos</b> 🎁.<br>Sumás 1 punto cada <b>$${stateB.config.ratioSpend.toLocaleString('es-AR')}</b> gastados.<br>Tenés beneficios de hasta <b>50% OFF</b> listos para canjear.`,
          points: 20,
          time: "19:00"
        }];
      } 
      else if (stepId === 2) { // 2. Caja rápida (DNI + Monto)
        stateB.viewMode = "CASH_REGISTER";
        document.getElementById('col1-title').innerText = "Terminal de Caja";
        document.getElementById('col1-role').innerText = "Paso 2: Operación";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Caja 1 · Activa';

        stateB.client.points = 200;
        stateB.chatHistory = [{
          type: "recv",
          text: `¡Hola María! Tenés <b>200 Puntos</b> acumulados.<br>Te faltan solo 10 puntos para tu <b>50% OFF (210 pts)</b>.`,
          points: 200,
          time: "19:30"
        }];
      } 
      else if (stepId === 3) { // 3. Canje y Endowed Progress Post-Canje
        stateB.viewMode = "CANJE_READY";
        document.getElementById('col1-title').innerText = "Terminal de Caja";
        document.getElementById('col1-role').innerText = "Paso 3: Canje";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Caja 1 · Activa';

        stateB.client.points = 220;
        stateB.chatHistory = [{
          type: "recv",
          text: `🎉 <b>¡Meta alcanzada María!</b><br>Tenés <b>220 Puntos</b> disponibles.<br>Podés canjear hoy tu <b>50% OFF (210 pts)</b> o tu <b>Postre / Roll chico (110 pts)</b>.`,
          points: 220,
          time: "20:00"
        }];
      }

      renderControlsB();
      renderB();
    }

    function renderControlsB() {
      document.getElementById('controls-panel').innerHTML = `
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Flujo de Venta (Puntos):</span>
        <div class="controls-btns">
          <button class="btn-ctrl ${activeStoryB === 1 ? 'active' : ''}" onclick="startStoryB(1)">1. Configurar (Dueño)</button>
          <button class="btn-ctrl ${activeStoryB === 2 ? 'active' : ''}" onclick="startStoryB(2)">2. Caja (DNI + Monto)</button>
          <button class="btn-ctrl ${activeStoryB === 3 ? 'active' : ''}" onclick="startStoryB(3)">3. Canje + Bono Arranque</button>
        </div>
      `;
    }

    function renderB() {
      renderCajaB();
      renderWhatsAppB();
    }

    function renderCajaB() {
      const el = document.getElementById('caja-view');
      const c = stateB.client;
      const cfg = stateB.config;

      // 1. CONFIGURACIÓN DEL DUEÑO
      if (stateB.viewMode === "ONBOARDING_SETUP") {
        let prizeRowsHtml = renderPrizeRowsHtml();

        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; font-size: 0.92rem;">Configurá tu Programa en 2 minutos</div>
            <p style="font-size: 0.73rem; color: var(--text-muted);">
              Te decimos cuánto podés regalar protegiendo tu margen e incentivando visitas reales.
            </p>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">Rubro de tu Negocio:</label>
              <select class="input-field" id="cfg-rubro" onchange="updateSetupMath()">
                <option value="0.08" selected>Gastronomía (Restaurante, Sushi, Café)</option>
                <option value="0.12">Servicios (Barbería, Estética, Lavadero)</option>
                <option value="0.05">Comercio / Tienda de Ropa</option>
              </select>
              <div style="font-size: 0.68rem; color: #79c0ff; margin-top: 3px;" id="txt-rubro-impact">
                ℹ️ Los negocios gastronómicos logran un <b>8% más de visitas repetidas</b> con puntos.
              </div>
            </div>

            <div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">Margen de Ganancia Estimado (%):</label>
                <span style="font-size: 0.68rem; color: var(--text-muted);">Sugerido: 65%</span>
              </div>
              <input type="number" class="input-field" id="cfg-margin-input" value="${cfg.marginPercent}" oninput="updateSetupMath()">
              <div style="font-size: 0.67rem; color: var(--text-muted); margin-top: 2px;">
                *Si tus platos varían mucho, poné el margen del que menos te conviene regalar (el más bajo).
              </div>
            </div>

            <div>
              <div style="display: flex; justify-content: space-between; font-size: 0.72rem;">
                <span style="color: var(--text-muted); font-weight: 600;">Estrategia de Beneficio:</span>
                <span style="font-weight: 700; color: #56d364;" id="label-slider-mode">Equilibrada (3.4% retorno)</span>
              </div>

    function updateSetupMath() {
      const dq = Number(document.getElementById('cfg-rubro').value);
      const m = (Number(document.getElementById('cfg-margin-input').value) || 65) / 100;
      const sliderVal = Number(document.getElementById('cfg-slider').value);

      let rubroTxt = "Los negocios gastronómicos logran un <b>8% más de visitas repetidas</b> con puntos.";
      if (dq === 0.12) rubroTxt = "Los servicios recurrentes (barberías, lavaderos) logran hasta un <b>12% más de recurrencia</b>.";
      else if (dq === 0.05) rubroTxt = "Las tiendas de indumentaria y retail logran un <b>5% de incremento de recompra</b>.";
      document.getElementById('txt-rubro-impact').innerHTML = `ℹ️ ${rubroTxt}`;

      const cmax = (m * dq) / (1 + dq);
      const s = sliderVal / 100;
      const crec = cmax * s;

      stateB.config.maxSafePercent = (cmax * 100).toFixed(1);
      stateB.config.recommendedPercent = (crec * 100).toFixed(1);

      document.getElementById('txt-cmax').innerText = `${stateB.config.maxSafePercent}%`;
      document.getElementById('txt-crec').innerText = `${stateB.config.recommendedPercent}%`;

      let modeTxt = "Equilibrada";
      let expTxt = "<b>Equilibrada:</b> Dejás un colchón de seguridad por si el programa rinde menos de lo proyectado.";
      if (sliderVal <= 50) {
        modeTxt = "Conservadora";
        expTxt = "<b>Conservadora:</b> Te guardás el máximo margen de seguridad por si el cliente no vuelve tan seguido.";
      } else if (sliderVal >= 90) {
        modeTxt = "Generosa";
        expTxt = "<b>Generosa:</b> Confiás en la proyección y usás casi todo el margen seguro que tu local permite.";
      }
      document.getElementById('label-slider-mode').innerText = `${modeTxt} (${stateB.config.recommendedPercent}% retorno)`;
      document.getElementById('txt-slider-explanation').innerHTML = expTxt;

      stateB.config.ratioSpend = 1000;
      const alpha = 1 / 1000;
      const vPuntoMax = crec / alpha;
      stateB.config.vPuntoMax = vPuntoMax > 5 ? vPuntoMax : 10;

      // Redondeo estético seguro: siempre hacia arriba al múltiplo de 10 más cercano
      // (Ceil step = 10 garantiza que R_real <= C_rec, el negocio jamás pierde margen)
      const roundStep = 10;
      stateB.config.prizes.forEach(p => {
        if (p.type === 'PERCENT_CAP') {
          p.worstCaseCost = Math.round(p.retailPrice * 0.5);
        } else {
          p.worstCaseCost = p.retailPrice;
        }
        const rawPts = p.worstCaseCost / stateB.config.vPuntoMax;
        p.points = Math.ceil(rawPts / roundStep) * roundStep;
      });

      const container = document.getElementById('prize-list-container');
      if (container) {
        container.innerHTML = renderPrizeRowsHtml();
      }

      // Si estamos en Onboarding, actualizar en tiempo real la radiografía financiera en columna 2
      if (stateB.viewMode === "ONBOARDING_SETUP") {
        renderWhatsAppB();
      }
    }

          max: 8,
          hasAvailablePrize: false,
          prizeCode: "SUSHI-8X91B",
          redeemedAt: null,
          isReusedCodeAttempt: false,
          isImmediateSecondBuyStory: false
        };
        stateA.chatHistory = [{
          type: "recv",
          text: "¡Hola María! Ya sos parte del Club.<br>⭐ Tenés <b>3 / 8 visitas</b> registradas.<br>Faltan 5 para tu Combo Gratis.",
          snapshotVisits: 3,
          time: "20:10"
        }];
      } else if (storyId === 2) {
        stateA.client = {
          name: "María González",
          phone: "+54 9 351 512-3456",
          visits: 4,
          max: 8,
          hasAvailablePrize: false,
          prizeCode: "SUSHI-8X91B",
          redeemedAt: null,
          isReusedCodeAttempt: false,
          isImmediateSecondBuyStory: true
        };
        stateA.chatHistory = [
          { type: "recv", text: "¡Hola María! ⭐ Tenés <b>3 / 8 visitas</b> registradas.", snapshotVisits: 3, time: "20:10" },
          { type: "recv", text: "🎉 <b>¡Visita acreditada!</b><br>Tu tarjeta ahora está en <b>4 / 8 ⭐</b>.", snapshotVisits: 4, time: "20:45" }
        ];
      } else if (storyId === 3) {
        stateA.client = {
          name: "María González",
          phone: "+54 9 351 512-3456",
          visits: 8,
          max: 8,
          hasAvailablePrize: true,
          prizeCode: "SUSHI-8X91B",
          redeemedAt: null,
          isReusedCodeAttempt: false,
          isImmediateSecondBuyStory: false
        };
        stateA.chatHistory = [{
          type: "recv",
          text: "🎉 <b>¡FELICITACIONES MARÍA!</b><br>Llegaste a tus <b>8 / 8 visitas ⭐</b>.<br><br>🎁 Tenés guardado en tu cuenta:<br><b>Combo 15 Piezas Gratis</b> (<code>SUSHI-8X91B</code>).",
          snapshotVisits: 8,
          time: "Ayer · 21:00"
        }];
      } else if (storyId === 4) {
        stateA.client = {
          name: "Cliente Desconocido",
          phone: "+54 9 351 987-6543",
          visits: 0,
          max: 8,
          hasAvailablePrize: false,
          prizeCode: "SUSHI-8X91B",
          redeemedAt: "Ayer · 21:30",
          isReusedCodeAttempt: true,
          isImmediateSecondBuyStory: false
        };
        stateA.chatHistory = [{
          type: "recv",
          text: "🍣 <b>¡Premio entregado!</b><br>Canjeaste tu Combo 15 Piezas.<br>El código <code>SUSHI-8X91B</code> ha quedado inutilizado.",
          snapshotVisits: 0,
          time: "Ayer · 21:30"
        }];
      }

      renderControlsA();
      renderA();
    }

    function renderControlsA() {
      document.getElementById('controls-panel').innerHTML = `
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Historias (Sellos):</span>
        <div class="controls-btns">
          <button class="btn-ctrl ${activeStoryA === 1 ? 'active' : ''}" onclick="startStoryA(1)">1. Normal (3/8)</button>
          <button class="btn-ctrl ${activeStoryA === 2 ? 'active' : ''}" onclick="startStoryA(2)">2. Doble Compra Sucesiva</button>
          <button class="btn-ctrl ${activeStoryA === 3 ? 'active' : ''}" onclick="startStoryA(3)">3. Premio Guardado (8/8)</button>
          <button class="btn-ctrl ${activeStoryA === 4 ? 'active' : ''}" onclick="startStoryA(4)">4. Cupón Ya Quemado</button>
        </div>
      `;
    }

    function renderA() {
      renderCajaA();
      renderWhatsAppA();
    }

    function renderCajaA() {
      const el = document.getElementById('caja-view');
      const c = stateA.client;

      if (stateA.cajaMode === "SCAN_READY") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; font-size: 0.9rem;">Escanear Cliente</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Apuntá la cámara al QR de la tarjeta de WhatsApp</p>
            <div class="scanner-mock">
              <div class="scan-laser"></div>
              <div style="font-size: 1.5rem;">📷</div>
              <div>Cámara activa · Esperando código...</div>
            </div>
            <button class="btn btn-action" onclick="executeScanByStoryA()">
              [ Simular lectura de QR ]
            </button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "CLIENT_DETECTED") {
        let prizeAlert = '';
        let actionButtons = '';

        if (c.hasAvailablePrize) {
          prizeAlert = `
            <div class="alert-box success">
              🎁 <b>CLIENTE CON BENEFICIO DISPONIBLE</b><br>
              Tiene guardado: <b>Combo 15 Piezas Gratis</b> (<code>${c.prizeCode}</code>).
            </div>
          `;
          actionButtons = `
            <button class="btn btn-action" style="background: var(--success);" onclick="stateA.cajaMode = 'CANJE_CONFIRM'; renderA();">
              [ 1. Canjear Premio Hoy (Combo Gratis) ]
            </button>
            <button class="btn btn-action" style="margin-top: 4px;" onclick="sumarVisitaConservandoPremioA()">
              [ 2. Pagar normal y Sumar Visita (Guardar Premio) ]
            </button>
          `;
        } else {
          actionButtons = `
            <button class="btn btn-action" onclick="confirmarCompraA()">
              [ + SUMAR VISITA ]
            </button>
          `;
        }

        el.innerHTML = `
          <div class="card">
            <div style="font-size: 1.05rem; font-weight: 700;">${c.name}</div>
            <div class="metric-box">
              <span style="font-size: 0.78rem; color: var(--text-muted);">Estado:</span>
              <span style="font-size: 1.1rem; font-weight: 800; color: #f59e0b;">⭐ ${c.visits} / 8 visitas</span>
            </div>
            ${prizeAlert}
            ${actionButtons}
            <button class="btn btn-outline" style="margin-top: 4px;" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cancelar</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "PROCESSING") {
        el.innerHTML = `
          <div class="card" style="text-align: center; padding: 40px 14px;">
            <div style="font-size: 1.3rem;">⏳</div>
            <div style="font-weight: 700; margin: 10px 0 4px;">Registrando operación...</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Disparando notificación oficial a WhatsApp</p>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "SUCCESS_DONE") {
        el.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 1.4rem; color: var(--success);">✓</div>
            <div style="font-weight: 700; font-size: 1.05rem;">Visita Acreditada</div>
            <div style="font-size: 1.3rem; font-weight: 800; color: #56d364; margin: 6px 0;">⭐ ${c.visits} / 8</div>
            <button class="btn btn-action" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Nueva Venta</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "WARNING_QUICK_BUY") {
        el.innerHTML = `
          <div class="card">
            <div style="font-size: 1rem; font-weight: 700;">${c.name}</div>
            <div class="alert-box warn">
              <b>COMPRA RECIENTE (hace 30s)</b><br>¿Confirmar 2do ticket legítimo (take away)?
            </div>
            <button class="btn btn-action" onclick="confirmarCompraA()">[ SÍ, CONFIRMAR SEGUNDA COMPRA ]</button>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cancelar</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "CANJE_CONFIRM") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700;">Canje de Recompensa</div>
            <div class="alert-box success">Beneficio: <b>Combo 15 Piezas</b><br>Código: <code>${c.prizeCode}</code></div>
            <button class="btn btn-action" style="background: var(--success);" onclick="canjearA()">[ ENTREGAR Y QUEMAR CÓDIGO ]</button>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'CLIENT_DETECTED'; renderA();">Volver</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "CANJE_DONE") {
        el.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 1.4rem; color: var(--success);">✓</div>
            <div style="font-weight: 700;">Premio Entregado</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Código quemado. Tarjeta en 0/8.</p>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cámara Lista</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "REUSED_BLOCKED") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; color: var(--danger);">Rechazo de Canje</div>
            <div class="alert-box danger">PREMIO YA UTILIZADO el ${c.redeemedAt} por Caja 1.</div>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Volver a Cámara</button>
          </div>
        `;
        return;
      }
    }

    function executeScanByStoryA() {
      if (stateA.client.isReusedCodeAttempt) stateA.cajaMode = "REUSED_BLOCKED";
      else if (stateA.client.isImmediateSecondBuyStory) stateA.cajaMode = "WARNING_QUICK_BUY";
      else stateA.cajaMode = "CLIENT_DETECTED";
      renderA();
    }

    function confirmarCompraA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits++;
        const v = stateA.client.visits;
        stateA.cajaMode = "SUCCESS_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🎉 <b>¡Visita acreditada!</b><br>Tu tarjeta ahora está en <b>${v} / 8 ⭐</b>.`,
          snapshotVisits: v,
          time: "20:15"
        });
        renderA();
      }, 1000);
    }

    function sumarVisitaConservandoPremioA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits = 1;
        stateA.cajaMode = "SUCCESS_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🎉 <b>¡Visita acreditada!</b><br>Nuevo ciclo: <b>1 / 8 ⭐</b>.<br>🎁 Premio Combo 15p sigue guardado.`,
          snapshotVisits: 1,
          time: "20:25"
        });
        renderA();
      }, 1000);
    }

    function canjearA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits = 0;
        stateA.client.hasAvailablePrize = false;
        stateA.cajaMode = "CANJE_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🍣 <b>¡Premio entregado!</b><br>Combo 15p canjeado. Código quemado.<br>Nueva tarjeta en <b>0 / 8 ⭐</b>.`,
          snapshotVisits: 0,
          time: "21:10"
        });
        renderA();
      }, 1000);
    }

    function renderWhatsAppA() {
      let el = document.getElementById('wa-chat');
      if (!el) {
        const bodyEl = document.getElementById('col2-body');
        if (bodyEl) {
          bodyEl.innerHTML = '<div class="wa-chat" id="wa-chat"></div>';
          el = document.getElementById('wa-chat');
        }
      }
      if (!el) return;
      let html = '';
      stateA.chatHistory.forEach(msg => {
        let stamps = '';
        for (let i = 1; i <= 8; i++) {
          const isFilled = i <= msg.snapshotVisits;
          const isPrize = i === 8;
          let cls = 'stamp';
          if (isPrize) cls += ' prize';
          if (isFilled) cls += ' active';
          stamps += `<div class="${cls}">${isPrize ? '🎁' : i}</div>`;
        }
        html += `
          <div class="wa-msg ${msg.type}">
            ${msg.text}
            <div class="stamps-box">
              <div style="font-size: 0.65rem; color: #8b949e; text-transform: uppercase;">Tarjeta Digital</div>
              <div class="grid-stamps">${stamps}</div>
              <div class="qr-client-img"><div class="qr-lines"></div></div>
              <div style="font-size: 0.65rem; color: #8b949e; margin-top: 3px;">Mostralo al pagar</div>
            </div>
            <div class="wa-time">${msg.time} ✓✓</div>
          </div>
        `;
      });
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    switchSystemMode('PUNTOS');
  </script>
</body>
</html>
