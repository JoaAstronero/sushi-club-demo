<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushi Club — Simulación de Modelos Loyalty</title>
  <style>
    :root {
      --bg: #090b0e;
      --panel: #12161f;
      --border: #232836;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --accent: #e04a3f;
      --accent-hover: #c7382d;
      --success: #238636;
      --warning: #d29922;
      --danger: #f85149;
      --wa-bg: #0b141a;
      --wa-bubble-me: #005c4b;
      --wa-bubble-sys: #202c33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px;
    }

    .system-selector {
      width: 100%;
      max-width: 860px;
      background: #11151f;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .sys-tab {
      flex: 1;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .sys-tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.02);
    }

    .sys-tab.active {
      background: #1c2230;
      border-color: #3b455b;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .top-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar h1 {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .workspace {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 980px;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
    }

    .screen-col {
      flex: 1;
      min-width: 320px;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .col-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .device {
      min-height: 590px;
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 28px rgba(0,0,0,0.5);
      position: relative;
    }

    /* CAJA TERMINAL */
    .caja-top {
      padding: 12px 16px;
      background: #0d0f15;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }

    .status-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    .dot-active {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
    }

    .caja-body {
      flex: 1;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      overflow-y: auto;
    }

    .card {
      background: #171b26;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .scanner-mock {
      background: #0d0f15;
      border: 2px dashed #2d3546;
      border-radius: 10px;
      height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    .scan-laser {
      position: absolute;
      top: 20%;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: laserMove 2.5s infinite ease-in-out;
    }

    @keyframes laserMove {
      0%, 100% { top: 15%; opacity: 0.4; }
      50% { top: 85%; opacity: 1; }
    }

    .metric-box {
      background: #0d0f15;
      padding: 10px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-field {
      width: 100%;
      padding: 9px 11px;
      background: #0d0f15;
      border: 1px solid #283044;
      border-radius: 6px;
      color: var(--text);
      font-size: 0.83rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    /* Ocultar flechas / spin-buttons por defecto de HTML en inputs numéricos */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    .slider-range {
      width: 100%;
      margin: 6px 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
    }

    .btn-action:hover {
      background: var(--accent-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }

    .btn-outline:hover {
      color: var(--text);
      border-color: #3f475a;
    }

    .alert-box {
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .alert-box.warn {
      background: rgba(210, 153, 34, 0.12);
      border-left: 3px solid var(--warning);
      color: #e3b341;
    }

    .alert-box.danger {
      background: rgba(248, 81, 73, 0.12);
      border-left: 3px solid var(--danger);
      color: #ff7b72;
    }

    .alert-box.success {
      background: rgba(35, 134, 54, 0.12);
      border-left: 3px solid var(--success);
      color: #56d364;
    }

    .alert-box.info {
      background: rgba(56, 139, 253, 0.1);
      border-left: 3px solid #388bfd;
      color: #79c0ff;
    }

    /* Multi-Premios Lista */
    .prize-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .prize-row {
      background: #0d0f15;
      border: 1px solid #232838;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
    }

    .prize-badge {
      background: #1c2230;
      color: #56d364;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
    }

    /* WHATSAPP CLIENTE */
    .wa-top {
      padding: 12px 14px;
      background: #202c33;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
    }

    .wa-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .wa-chat {
      flex: 1;
      background: var(--wa-bg);
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wa-msg {
      max-width: 88%;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.35;
      animation: msgPop 0.25s ease-out;
    }

    @keyframes msgPop {
      0% { opacity: 0; transform: translateY(8px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .wa-msg.sent {
      background: var(--wa-bubble-me);
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .wa-msg.recv {
      background: var(--wa-bubble-sys);
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .wa-time {
      font-size: 0.62rem;
      color: rgba(255,255,255,0.45);
      text-align: right;
      margin-top: 3px;
    }

    /* Puntos Modelo B */
    .points-badge {
      background: #11141c;
      border: 1px solid #283042;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      text-align: center;
    }

    .points-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: #56d364;
      margin: 4px 0;
    }

    .qr-client-img {
      width: 70px;
      height: 70px;
      background: #fff;
      margin: 6px auto 2px;
      border-radius: 4px;
      padding: 4px;
    }

    .qr-lines {
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(45deg, #111, #111 4px, #fff 4px, #fff 8px);
    }

    /* Sellos Modelo A */
    .stamps-box {
      background: #11141c;
      border: 1px solid #283042;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      text-align: center;
    }

    .grid-stamps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin: 8px 0;
    }

    .stamp {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px dashed #3a445b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      color: #64748b;
    }

    .stamp.active {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-weight: bold;
    }

    .stamp.prize {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    .stamp.prize.active {
      background: #f59e0b;
      color: #000;
      border-color: #f59e0b;
    }

    /* CONTROLES INFERIORES */
    .controls-panel {
      width: 100%;
      max-width: 860px;
      margin-top: 14px;
      background: #10131b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-ctrl {
      background: #171b26;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.74rem;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-ctrl:hover {
      color: var(--text);
      border-color: #3b455b;
    }

    .btn-ctrl.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- SELECTOR DE MODELO DE NEGOCIO -->
  <div class="system-selector">
    <button class="sys-tab" id="tab-model-a" onclick="switchSystemMode('SELLOS')">
      Modelo A: Tarjeta de Sellos (Visitas 1/8)
    </button>
    <button class="sys-tab active" id="tab-model-b" onclick="switchSystemMode('PUNTOS')">
      Modelo B: Sistema de Puntos ($ / Puntos + Configuración)
    </button>
  </div>

  <div class="top-bar">
    <h1 id="top-title">SUSHI CLUB · SISTEMA DE PUNTOS</h1>
    <div style="font-size: 0.72rem; color: var(--text-muted);" id="top-sub">
      Modelado prudente de beneficios + Operación ágil en caja
    </div>
  </div>

  <div class="workspace">
    
    <!-- COLUMNA 1: TERMINAL CAJA / CONFIGURACIÓN -->
    <div class="screen-col">
      <div class="col-label">
        <span id="col1-title">Configuración del Dueño</span>
        <span id="col1-role">Paso 1: Setup</span>
      </div>
      <div class="device">
        <div class="caja-top">
          <span style="font-weight: 700;" id="caja-brand-title">SUSHI CLUB</span>
          <span class="status-tag" id="caja-status-tag"><span class="dot-active"></span>Configuración Activa</span>
        </div>
        
        <div class="caja-body" id="caja-view">
          <!-- Render dinámico -->
        </div>
      </div>
    </div>

    <!-- COLUMNA 2: WHATSAPP DEL CLIENTE -->
    <div class="screen-col">
      <div class="col-label">
        <span id="col2-title">Celular del Cliente</span>
        <span id="col2-role">Canal: WhatsApp</span>
      </div>
      <div class="device" id="device-col2">
        <div id="col2-header">
          <div class="wa-top">
            <div class="wa-avatar">🍣</div>
            <div>
              <div style="font-weight: 700;">Sushi Club Oficial</div>
              <div style="font-size: 0.65rem; color: #8696a0;">Cuenta comercial verificada</div>
            </div>
          </div>
        </div>
        
        <div id="col2-body" style="flex:1; display:flex; flex-direction:column; overflow-y:auto;">
          <div class="wa-chat" id="wa-chat">
            <!-- Render dinámico -->
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- PANEL DE HISTORIAS INFERIOR -->
  <div class="controls-panel" id="controls-panel">
    <!-- Se inyecta según Modelo A o Modelo B -->
  </div>

  <script>
    let currentSystem = 'PUNTOS';

    // ==========================================
    // ESTADO MODELO B: PUNTOS CON PREMIO % DEFAULT Y ENDOWED PROGRESS
    // ==========================================
    let activeStoryB = 1;
    const stateB = {
      viewMode: "ONBOARDING_SETUP",
      config: {
        ratioSpend: 1000, // Cada $1000 = 1 punto
        vPuntoMax: 34,
        marginPercent: 65,
        deltaQ: 0.08,
        sliderFactor: 0.70,
        maxSafePercent: 4.8,
        recommendedPercent: 3.4,
        activePrizeIndex: 0,
        // Catálogo configurable con precios de carta (PVP) y topes de seguridad
        prizes: [
          { id: 0, name: "50% OFF en tu Combo Favorito", type: "PERCENT_CAP", retailPrice: 14000, worstCaseCost: 7000, points: 230, isDefault: true },
          { id: 1, name: "Combo 15 Piezas Gratis", type: "FIXED", retailPrice: 10000, worstCaseCost: 3500, points: 180, isDefault: false },
          { id: 2, name: "Postre o Roll chico", type: "FIXED", retailPrice: 3500, worstCaseCost: 1225, points: 80, isDefault: false }
        ]
      },
      client: {
        dni: "38.123.456",
        name: "María González",
        phone: "+54 9 351 512-3456",
        points: 150,
        lastAddedPoints: 0,
        lastSpendAmount: 0
      },
      chatHistory: []
    };

    function switchSystemMode(mode) {
      currentSystem = mode;
      document.getElementById('tab-model-a').classList.toggle('active', mode === 'SELLOS');
      document.getElementById('tab-model-b').classList.toggle('active', mode === 'PUNTOS');

      if (mode === 'SELLOS') {
        document.getElementById('top-title').innerText = "SUSHI CLUB · SIMULACIÓN OPERATIVA (SELLOS)";
        document.getElementById('top-sub').innerText = "Flujo reactivo: Terminal de Caja ⇄ WhatsApp";
        document.getElementById('col1-title').innerText = "Terminal del Comercio";
        document.getElementById('col1-role').innerText = "Rol: Cajero";
        const headerEl = document.getElementById('col2-header');
        if (headerEl) {
          headerEl.innerHTML = `
            <div class="wa-top">
              <div class="wa-avatar">🍣</div>
              <div>
                <div style="font-weight: 700;">Sushi Club Oficial</div>
                <div style="font-size: 0.65rem; color: #8696a0;">Cuenta comercial verificada</div>
              </div>
            </div>
          `;
        }
        const bodyEl = document.getElementById('col2-body');
        if (bodyEl) {
          bodyEl.innerHTML = `<div class="wa-chat" id="wa-chat"></div>`;
        }
        startStoryA(1);
      } else {
        document.getElementById('top-title').innerText = "SUSHI CLUB · SISTEMA DE PUNTOS";
        document.getElementById('top-sub').innerText = "Modelado prudente de beneficios + Operación ágil en caja";
        startStoryB(activeStoryB);
      }
    }

    function startStoryB(stepId) {
      activeStoryB = stepId;

      if (stepId === 1) { // 1. Configuración Dueño
        stateB.viewMode = "ONBOARDING_SETUP";
        document.getElementById('col1-title').innerText = "Configuración del Dueño";
        document.getElementById('col1-role').innerText = "Paso 1: Setup";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Configuración Activa';

        stateB.chatHistory = [{
          type: "recv",
          text: `¡Hola María! Ya sos parte del Club Sushi.<br>Tu saldo inicial incluye un <b>Bono de Bienvenida de 20 Puntos</b> 🎁.<br>Sumás 1 punto cada <b>$${stateB.config.ratioSpend.toLocaleString('es-AR')}</b> gastados.<br>Podés acumular puntos para alcanzar hasta un <b>50% OFF</b> en tus platos favoritos.`,
          points: 20,
          time: "19:00"
        }];
      } 
      else if (stepId === 2) { // 2. Caja rápida (DNI + Monto)
        stateB.viewMode = "CASH_REGISTER";
        document.getElementById('col1-title').innerText = "Terminal de Caja";
        document.getElementById('col1-role').innerText = "Paso 2: Operación";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Caja 1 · Activa';

        stateB.client.points = 215;
        stateB.chatHistory = [{
          type: "recv",
          text: `¡Hola María! Tenés <b>215 Puntos</b> acumulados.<br>Te faltan solo 15 puntos para tu <b>50% OFF (230 pts)</b>.`,
          points: 215,
          time: "19:30"
        }];
      } 
      else if (stepId === 3) { // 3. Canje y Endowed Progress Post-Canje
        stateB.viewMode = "CANJE_READY";
        document.getElementById('col1-title').innerText = "Terminal de Caja";
        document.getElementById('col1-role').innerText = "Paso 3: Canje";
        document.getElementById('caja-status-tag').innerHTML = '<span class="dot-active"></span>Caja 1 · Activa';

        stateB.client.points = 240;
        stateB.chatHistory = [{
          type: "recv",
          text: `🎉 <b>¡Meta alcanzada María!</b><br>Tenés <b>240 Puntos</b> disponibles.<br>Podés canjear hoy tu <b>50% OFF (230 pts)</b> o tu <b>Postre / Roll chico (80 pts)</b>.`,
          points: 240,
          time: "20:00"
        }];
      }

      renderControlsB();
      renderB();
      if (stepId === 1) {
        updateSetupMath();
      }
    }

    function renderControlsB() {
      document.getElementById('controls-panel').innerHTML = `
        <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600;">Flujo de Venta (Puntos):</span>
        <div class="controls-btns">
          <button class="btn-ctrl ${activeStoryB === 1 ? 'active' : ''}" onclick="startStoryB(1)">1. Configurar (Dueño)</button>
          <button class="btn-ctrl ${activeStoryB === 2 ? 'active' : ''}" onclick="startStoryB(2)">2. Caja (DNI + Monto)</button>
          <button class="btn-ctrl ${activeStoryB === 3 ? 'active' : ''}" onclick="startStoryB(3)">3. Canje + Bono Arranque</button>
        </div>
      `;
    }

    function renderB() {
      renderCajaB();
      renderWhatsAppB();
    }

    function renderCajaB() {
      const el = document.getElementById('caja-view');
      const c = stateB.client;
      const cfg = stateB.config;

      // 1. CONFIGURACIÓN DEL DUEÑO
      if (stateB.viewMode === "ONBOARDING_SETUP") {
        let prizeRowsHtml = renderPrizeRowsHtml();

        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; font-size: 0.92rem;">Estimá los parámetros de tu Programa</div>
            <p style="font-size: 0.73rem; color: var(--text-muted);">
              Calculá un rango de beneficios prudente para cuidar tu margen operativo según tu rotación estimada.
            </p>

            <div>
              <label style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">Rubro de Referencia:</label>
              <select class="input-field" id="cfg-rubro" onchange="updateSetupMath()">
                <option value="0.08" selected>Gastronomía (Restaurante, Sushi, Café)</option>
                <option value="0.12">Servicios recurrentes (Barbería, Estética, Lavadero)</option>
                <option value="0.05">Comercio / Tienda de Ropa / Retail</option>
              </select>
              <div style="font-size: 0.68rem; color: #79c0ff; margin-top: 3px;" id="txt-rubro-impact">
                ℹ️ Estimación de referencia: comercios gastronómicos suelen proyectar <b>entre un 6% y 8% de visitas adicionales</b>.
              </div>
            </div>

            <div>
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600;">Margen Bruto Estimado (%):</label>
                <span style="font-size: 0.68rem; color: var(--text-muted);">Referencia sugerida: ~65%</span>
              </div>
              <input type="number" class="input-field" id="cfg-margin-input" value="${cfg.marginPercent}" oninput="updateSetupMath()">
              <div style="font-size: 0.67rem; color: var(--text-muted); margin-top: 2px;">

              <div class="prize-list" id="prize-list-container">

              <button class="btn btn-outline" style="margin-top: 6px; font-size: 0.72rem; padding: 7px 10px; border-style: dashed; width: 100%; color: #79c0ff; border-color: #388bfd; background: rgba(56, 139, 253, 0.05); display: flex; align-items: center; justify-content: center; gap: 6px;" onclick="openPrizePlaygroundModal()">
                <span>+</span> <b>Diseñar y Probar Nuevo Beneficio (Playground)</b>

              [ APLICAR Y PROBAR COBRO EN CAJA → ]
            </button>
          </div>
        `;
        return;
      }

      // 2. CAJA RÁPIDA
      if (stateB.viewMode === "CASH_REGISTER") {
        el.innerHTML = `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-weight: 700; font-size: 0.9rem;">Cobro y Acreditación de Puntos</span>
              <span style="font-size: 0.68rem; background: #1c2230; padding: 2px 6px; border-radius: 4px; color: #56d364;">
                Regla: $${cfg.ratioSpend.toLocaleString('es-AR')} = 1 pt
              </span>

            <p style="font-size: 0.74rem; color: var(--text-muted);">

            <button class="btn btn-action" onclick="confirmarPuntosB()">

              <button class="btn btn-action" style="width: auto; padding: 6px 12px; font-size: 0.72rem; background: ${canAfford ? 'var(--success)' : '#232836'};"

          <div class="card" style="text-align: center; padding: 40px 14px;">

          <div class="card" style="text-align: center;">

            <p style="font-size: 0.8rem; color: var(--text-muted); margin: 6px 0;">

            <div style="font-size: 1.3rem; font-weight: 800; color: #56d364; margin: 8px 0;">
              Nuevo Saldo: ${stateB.client.points} Puntos

    function updateSetupMath(rebuildList = true) {
      const dq = Number(document.getElementById('cfg-rubro').value);
      const m = (Number(document.getElementById('cfg-margin-input').value) || 65) / 100;
      const sliderVal = Number(document.getElementById('cfg-slider').value);

      let rubroTxt = "Estimación de referencia: comercios gastronómicos suelen proyectar <b>entre un 6% y 8% de visitas adicionales</b>.";
      if (dq === 0.12) rubroTxt = "Servicios de alta rotación (barberías, lavados): referencias de <b>hasta un 10% a 12%</b> de mayor recurrencia.";
      else if (dq === 0.05) rubroTxt = "Retail / indumentaria: referencias conservadoras de <b>alrededor del 4% a 5%</b> de recompra.";
      document.getElementById('txt-rubro-impact').innerHTML = `ℹ️ ${rubroTxt}`;

      const cmax = (m * dq) / (1 + dq);
      const s = sliderVal / 100;
      const crec = cmax * s;

      stateB.config.maxSafePercent = (cmax * 100).toFixed(1);
      stateB.config.recommendedPercent = (crec * 100).toFixed(1);

      let modeTxt = "Equilibrado";
      let expTxt = "<b>Equilibrado:</b> Busca un balance intermedio, reservando margen por si la respuesta del cliente es inferior a la estimación.";
      if (sliderVal <= 50) {
        modeTxt = "Conservador";
        expTxt = "<b>Conservador:</b> Asigna un costo menor en beneficios (desde ~2.4%), priorizando máxima prudencia de caja.";
      } else if (sliderVal >= 90) {
        modeTxt = "Flexible (Límite Máximo)";
        expTxt = "<b>Flexible:</b> Confiás en la proyección y usás el 100% de tu techo. <span style='color:#f59e0b;'>⚠️ Sin colchón ante imprevistos.</span>";
      }
      
      const elMode = document.getElementById('label-slider-mode');
      if (elMode) elMode.innerText = `${modeTxt} (~${stateB.config.recommendedPercent}% costo)`;
      const elExp = document.getElementById('txt-slider-explanation');
      if (elExp) elExp.innerHTML = expTxt;

      stateB.config.ratioSpend = 1000;
      const alpha = 1 / 1000;
      const vPuntoMax = crec / alpha;
      stateB.config.vPuntoMax = vPuntoMax > 5 ? vPuntoMax : 10;
      const vpVal = Math.round(stateB.config.vPuntoMax);

      const elVpRule = document.getElementById('txt-vpunto-rule');
      if (elVpRule) elVpRule.innerText = vpVal;

      // Actualizar tarjeta de presupuesto seguro con advertencia visual si está en el borde del abismo
      const boxBudget = document.getElementById('box-budget-alert');
      if (boxBudget) {
        const colchon = (cmax * 100 - crec * 100).toFixed(1);
        if (sliderVal >= 90) {
          boxBudget.className = "alert-box warn";
          boxBudget.style.borderLeft = "3px solid #f59e0b";
          boxBudget.style.background = "rgba(245, 158, 11, 0.12)";
          boxBudget.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
              <span>⚠️ <b>Borde del abismo:</b> Techo: <b>${stateB.config.maxSafePercent}%</b> · Objetivo: <b style="color:#f59e0b;">${stateB.config.recommendedPercent}%</b></span>
              <span style="background: rgba(245, 158, 11, 0.25); padding: 1px 6px; border-radius: 4px; font-weight: 700; color: #f59e0b;">
                1 pt = hasta $${vpVal}
              </span>
            </div>
            <div style="font-size: 0.65rem; color: #f59e0b; line-height: 1.25;">
              Estás usando el 100% de tu margen seguro (colchón: 0.0%). Si las visitas adicionales rinden menos de lo estimado, entrás en zona deficitaria.
            </div>
          `;
        } else if (sliderVal <= 50) {
          boxBudget.className = "alert-box success";
          boxBudget.style.borderLeft = "3px solid #56d364";
          boxBudget.style.background = "rgba(86, 211, 100, 0.12)";
          boxBudget.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
              <span>🛡️ <b>Presupuesto conservador:</b> Techo: <b>${stateB.config.maxSafePercent}%</b> · Objetivo: <b style="color:#56d364;">${stateB.config.recommendedPercent}%</b></span>
              <span style="background: rgba(86, 211, 100, 0.2); padding: 1px 6px; border-radius: 4px; font-weight: 700; color: #56d364;">
                1 pt = hasta $${vpVal}
              </span>
            </div>
            <div style="font-size: 0.65rem; color: var(--text-muted);">
              Máximo colchón de seguridad (+${colchon}%). Muy bajo riesgo de descalce si las visitas no aumentan como se estimaba.
            </div>
          `;
        } else {
          boxBudget.className = "alert-box info";
          boxBudget.style.borderLeft = "3px solid #388bfd";
          boxBudget.style.background = "rgba(56, 139, 253, 0.1)";
          boxBudget.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
              <span>⚖️ <b>Presupuesto equilibrado:</b> Techo: <b>${stateB.config.maxSafePercent}%</b> · Objetivo: <b style="color:#56d364;">${stateB.config.recommendedPercent}%</b></span>
              <span style="background: rgba(56, 139, 253, 0.2); padding: 1px 6px; border-radius: 4px; font-weight: 700; color: #79c0ff;">
                1 pt = hasta $${vpVal}
              </span>
            </div>
            <div style="font-size: 0.65rem; color: var(--text-muted);">
              Colchón de seguridad: <b>+${colchon}%</b>. Regla mental: dividís el costo por $${vpVal} para obtener los puntos seguros.
            </div>
          `;
        }
      }

      // Redondeo estético seguro si el premio no tiene puntos manuales personalizados
      const roundStep = 10;
      const bonoBienvenida = 20;
      const defaultVPunto = 33.66; // Referencia al 70% default (m=65%, dq=8%)
      const vRatio = defaultVPunto / stateB.config.vPuntoMax;

      stateB.config.prizes.forEach(p => {
        let costoItem = 0;
        if (p.type === 'PERCENT_CAP') {
          p.worstCaseCost = Math.round(p.retailPrice * 0.5);
          costoItem = p.worstCaseCost;
        } else {
          costoItem = Math.round(p.retailPrice * (1 - (m / 100)));
          p.worstCaseCost = costoItem;
        }
        if (!p.isCustomPoints) {
          const rawPtsPagados = costoItem / stateB.config.vPuntoMax;
          const ptsPagadosMin = Math.ceil(rawPtsPagados / roundStep) * roundStep;
          if (p.id === 1) {
            // Combo 15 piezas: escalón intermedio calibrado (160 pts pagados al default, escala con prudencia)
            const targetPagados = Math.max(ptsPagadosMin, Math.round(160 * vRatio));
            p.points = Math.ceil(targetPagados / roundStep) * roundStep + bonoBienvenida;
          } else if (p.id === 2) {
            // Postre o roll chico: escalón accesible (60 pts pagados al default, escala con prudencia)
            const targetPagados = Math.max(ptsPagadosMin, Math.round(60 * vRatio));
            p.points = Math.ceil(targetPagados / roundStep) * roundStep + bonoBienvenida;
          } else {
            // 50% OFF Insignia: fórmula directa (210 pts pagados al default + 20 bono = 230 pts)
            p.points = ptsPagadosMin + bonoBienvenida;
          }
        }
      });

      const container = document.getElementById('prize-list-container');
      if (container && rebuildList !== false) {
        container.innerHTML = renderPrizeRowsHtml();
      }

      // Si estamos en Onboarding, actualizar en tiempo real la radiografía financiera en columna 2
      if (stateB.viewMode === "ONBOARDING_SETUP") {
        renderWhatsAppB();
      }
    }

    function renderPrizeRowsHtml() {
      const m = (Number(document.getElementById('cfg-margin-input') ? document.getElementById('cfg-margin-input').value : stateB.config.marginPercent) || 65);
      const cmaxPct = Number(stateB.config.maxSafePercent);
      const crecPct = Number(stateB.config.recommendedPercent);

      let rowsHtml = '';
      stateB.config.prizes.forEach((p, idx) => {
        const isSelected = (idx === (stateB.config.activePrizeIndex || 0));
        const isPercent = (p.type === 'PERCENT_CAP');
        
        let costoItem = isPercent ? p.worstCaseCost : Math.round(p.retailPrice * (1 - (m / 100)));
        const gastoItem = p.points * stateB.config.ratioSpend;
        const pctItem = gastoItem > 0 ? (costoItem / gastoItem) * 100 : 0;

        const isDeficitItem = pctItem > (cmaxPct + 0.05);
        const isWarnItem = (!isDeficitItem) && (pctItem > crecPct + 0.05);

        let borderCol = isSelected ? '#388bfd' : '#232838';
        let bgCol = isSelected ? '#131b2c' : '#0d0f15';
        if (isDeficitItem) {
          borderCol = isSelected ? '#f85149' : '#5c1d1d';
          bgCol = isSelected ? '#251214' : '#170c0e';
        }

        rowsHtml += `
          <div class="prize-row" id="prize-row-${idx}" onclick="selectPrizeForInspection(${idx})" style="cursor:pointer; border: 1px solid ${borderCol}; background: ${bgCol}; margin-bottom: 4px; padding: 6px 9px; border-radius: 6px; transition: all 0.15s ease;">
            <div style="flex:1;">
              <div style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
                <b style="color: ${isSelected ? '#fff' : '#c9d1d9'}; font-size: 0.76rem;">${p.name}</b>
                ${p.isDefault ? '<span style="font-size:0.56rem; color:#56d364; background:rgba(86,211,100,0.15); padding:1px 4px; border-radius:3px;">Insignia</span>' : ''}
                ${isPercent 
                  ? '<span style="font-size:0.56rem; color:#79c0ff; background:rgba(121,192,255,0.12); padding:1px 4px; border-radius:3px;">Inmune a inflación</span>'
                  : '<span style="font-size:0.56rem; color:#d29922; background:rgba(210,153,34,0.15); padding:1px 4px; border-radius:3px;">Revisar cada 3-6 meses</span>'
                }
                ${isDeficitItem ? `<span style="font-size:0.56rem; color:#ff7b72; background:rgba(248,81,73,0.2); padding:1px 4px; border-radius:3px; font-weight:700;">🚨 Deficitario (${pctItem.toFixed(1)}%)</span>` : ''}
                ${isWarnItem ? `<span style="font-size:0.56rem; color:#f59e0b; background:rgba(245,158,11,0.2); padding:1px 4px; border-radius:3px; font-weight:700;">⚠️ Ajustado (${pctItem.toFixed(1)}%)</span>` : ''}
              </div>
              <div style="color: var(--text-muted); font-size: 0.65rem; margin-top: 2px;">
                ${isPercent 
                  ? 'Descuento en ticket. Si sube la carta, no requiere cambiar los puntos.' 
                  : 'Producto físico gratis. Si sube por inflación, conviene ajustar sus puntos.'}
              </div>
              <div style="display:flex; align-items:center; gap:8px; margin-top:3px; font-size:0.67rem; color:var(--text-muted);" onclick="event.stopPropagation()">
                <span>Carta: $</span>
                <input type="number" class="input-field" style="width:64px; padding:1px 4px; font-size:0.68rem; text-align:right;" value="${p.retailPrice}" oninput="updatePrizePrice(${idx}, this.value)">
                <span>Meta:</span>
                <input type="number" class="input-field" style="width:52px; padding:1px 4px; font-size:0.68rem; text-align:right; font-weight:700; color:${isDeficitItem ? '#ff7b72' : (isWarnItem ? '#f59e0b' : '#56d364')}; border-color:${isDeficitItem ? '#f85149' : '#283044'};" value="${p.points}" oninput="updatePrizePointsManual(${idx}, this.value)">
                <span>PTS</span>
              </div>
            </div>
            <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px;">
              <span id="prize-badge-${idx}" class="prize-badge" style="font-size:0.7rem; padding:2px 5px; background:${isDeficitItem ? 'rgba(248,81,73,0.2)' : (isWarnItem ? 'rgba(245,158,11,0.2)' : '#1c2230')}; color:${isDeficitItem ? '#ff7b72' : (isWarnItem ? '#f59e0b' : '#56d364')};">${p.points} PTS</span>
              <div style="display:flex; align-items:center; gap:6px;">
                <span style="font-size:0.6rem; color:${isDeficitItem ? '#ff7b72' : (isSelected ? '#79c0ff' : 'var(--text-muted)')}; font-weight:600;">
                  ${isSelected ? (isDeficitItem ? '● En Déficit' : '● Validando') : 'Tocá para validar'}
                </span>
                ${!p.isDefault ? `<button onclick="event.stopPropagation(); deletePrize(${idx});" style="background:transparent; border:none; color:#8b949e; cursor:pointer; font-size:0.75rem; padding:0 2px; line-height:1;" title="Eliminar beneficio">✕</button>` : ''}
              </div>
            </div>
          </div>
        `;
      });
      return rowsHtml;
    }

    function selectPrizeForInspection(idx) {
      stateB.config.activePrizeIndex = idx;
      updateSetupMath(true);
    }

    function updatePrizePointsManual(idx, newPts) {
      const val = Number(newPts);
      if (val < 10) return;
      stateB.config.prizes[idx].points = val;
      stateB.config.prizes[idx].isCustomPoints = true;
      updateSetupMath(false); // NO destruye el input mientras el usuario escribe
      updatePrizeRowVisualStatus(idx);
    }

    function resetPrizePointsSafe(idx, safePts) {
      stateB.config.prizes[idx].points = safePts;
      stateB.config.prizes[idx].isCustomPoints = false;
      updateSetupMath(true);
    }

    function updatePrizePrice(idx, newPrice) {
      const val = Number(newPrice) || 0;
      if (val < 100) return;
      stateB.config.prizes[idx].retailPrice = val;
      const m = (Number(document.getElementById('cfg-margin-input') ? document.getElementById('cfg-margin-input').value : stateB.config.marginPercent) || 65);
      if (stateB.config.prizes[idx].type === 'PERCENT_CAP') {
        stateB.config.prizes[idx].worstCaseCost = Math.round(val * 0.5);
      } else {
        stateB.config.prizes[idx].worstCaseCost = Math.round(val * (1 - (m / 100)));
      }
      updateSetupMath(false); // NO destruye el input mientras el usuario escribe
      updatePrizeRowVisualStatus(idx);
    }

    function updatePrizeRowVisualStatus(idx) {
      const p = stateB.config.prizes[idx];
      if (!p) return;
      const m = (Number(document.getElementById('cfg-margin-input') ? document.getElementById('cfg-margin-input').value : stateB.config.marginPercent) || 65);
      const isPercent = (p.type === 'PERCENT_CAP');
      const costoItem = isPercent ? p.worstCaseCost : Math.round(p.retailPrice * (1 - (m / 100)));
      const gastoItem = p.points * stateB.config.ratioSpend;
      const pctItem = gastoItem > 0 ? (costoItem / gastoItem) * 100 : 0;
      const cmaxPct = Number(stateB.config.maxSafePercent);
      const crecPct = Number(stateB.config.recommendedPercent);
      const isDeficit = pctItem > (cmaxPct + 0.05);
      const isWarn = (!isDeficit) && (pctItem > crecPct + 0.05);

      const badge = document.getElementById(`prize-badge-${idx}`);
      if (badge) {
        badge.innerText = `${p.points} PTS`;
        badge.style.background = isDeficit ? 'rgba(248,81,73,0.2)' : (isWarn ? 'rgba(245,158,11,0.2)' : '#1c2230');
        badge.style.color = isDeficit ? '#ff7b72' : (isWarn ? '#f59e0b' : '#56d364');
      }
    }

    function deletePrize(idx) {
      if (stateB.config.prizes.length <= 1) return;
      stateB.config.prizes.splice(idx, 1);
      if (stateB.config.activePrizeIndex >= stateB.config.prizes.length) {
        stateB.config.activePrizeIndex = 0;
      }
      updateSetupMath(true);
    }

    // ==========================================
    // PLAYGROUND MODAL PARA NUEVOS BENEFICIOS (DOM PERSISTENTE SIN RE-CREAR INPUTS)
    // ==========================================
    const playgroundState = {
      type: 'FIXED', // 'FIXED' | 'PERCENT_CAP'
      name: 'Gyozas de Salmón (6u)',
      retailPrice: 4500,
      marginPercent: 65,
      discountPercent: 25,
      ticketMax: 16000,
      customPoints: null
    };

    function openPrizePlaygroundModal() {
      const mGlobal = (Number(document.getElementById('cfg-margin-input') ? document.getElementById('cfg-margin-input').value : stateB.config.marginPercent) || 65);
      playgroundState.marginPercent = mGlobal;
      playgroundState.customPoints = null;
      if (!playgroundState.name) {
        playgroundState.name = playgroundState.type === 'FIXED' ? 'Gyozas de Salmón (6u)' : '25% OFF en Factura';
      }
      const modal = document.getElementById('prize-playground-modal');
      if (modal) {
        buildPlaygroundModalDOM();
        modal.style.display = 'flex';
        updatePlaygroundLive(true);
      }
    }

    function closePrizePlaygroundModal() {
      const modal = document.getElementById('prize-playground-modal');
      if (modal) modal.style.display = 'none';
    }

    function togglePlaygroundType(type) {
      playgroundState.type = type;
      playgroundState.customPoints = null;
      const isFixed = (type === 'FIXED');

      const tabFixed = document.getElementById('pg-tab-fixed');
      const tabPercent = document.getElementById('pg-tab-percent');
      if (tabFixed) tabFixed.classList.toggle('active', isFixed);
      if (tabPercent) tabPercent.classList.toggle('active', !isFixed);

      const fFixed = document.getElementById('pg-fields-fixed');
      const fPercent = document.getElementById('pg-fields-percent');
      if (fFixed) fFixed.style.display = isFixed ? 'block' : 'none';
      if (fPercent) fPercent.style.display = isFixed ? 'none' : 'block';

      const nameInput = document.getElementById('pg-input-name');
      if (nameInput) {
        if (isFixed && (!nameInput.value || nameInput.value.includes('OFF'))) {
          nameInput.value = 'Gyozas de Salmón (6u)';
          playgroundState.name = nameInput.value;
        } else if (!isFixed && (!nameInput.value || !nameInput.value.includes('OFF'))) {
          const disc = document.getElementById('pg-input-disc-pct') ? document.getElementById('pg-input-disc-pct').value : 25;
          nameInput.value = `${disc}% OFF en Factura`;
          playgroundState.name = nameInput.value;
        }
      }

      updatePlaygroundLive(true);
    }

    function handlePlaygroundSlider(val) {
      const num = Number(val);
      playgroundState.customPoints = num;
      const ptsInput = document.getElementById('pg-pts-input');
      if (ptsInput) ptsInput.value = num;
      updatePlaygroundLive(false);
    }

    function handlePlaygroundPointsInput(val) {
      const num = Number(val);
      if (num >= 10) {
        playgroundState.customPoints = num;
        const slider = document.getElementById('pg-pts-slider');
        if (slider) slider.value = num;
        updatePlaygroundLive(false);
      }
    }

    function handlePlaygroundCostChange() {
      if (playgroundState.type === 'FIXED') {
        const pvpEl = document.getElementById('pg-input-retail');
        const mEl = document.getElementById('pg-input-margin');
        if (pvpEl) playgroundState.retailPrice = Number(pvpEl.value) || 0;
        if (mEl) playgroundState.marginPercent = Number(mEl.value) || 0;
      } else {
        const discEl = document.getElementById('pg-input-disc-pct');
        const maxEl = document.getElementById('pg-input-ticket-max');
        if (discEl) playgroundState.discountPercent = Number(discEl.value) || 0;
        if (maxEl) playgroundState.ticketMax = Number(maxEl.value) || 0;
      }
      updatePlaygroundLive(true);
    }

    function setPlaygroundPointsDefault() {
      playgroundState.customPoints = null;
      updatePlaygroundLive(true);
    }

    function calculatePlaygroundSuggestedPoints(costo) {
      const vpVal = stateB.config.vPuntoMax || 34;
      const rawPts = costo / vpVal;
      const ptsPagados = Math.ceil(rawPts / 10) * 10;
      return ptsPagados + 20; // Absorbe bono inicial de bienvenida
    }

    function updatePlaygroundLive(resetSliderToSug = false) {
      const mGlobal = (Number(document.getElementById('cfg-margin-input') ? document.getElementById('cfg-margin-input').value : stateB.config.marginPercent) || 65);
      const isPercent = (playgroundState.type === 'PERCENT_CAP');
      const crec = Number(stateB.config.recommendedPercent);
      const cmax = Number(stateB.config.maxSafePercent);
      const vpVal = Math.round(stateB.config.vPuntoMax || 34);
      const bonoBienvenida = 20;

      let costoReal = 0;
      if (!isPercent) {
        const pvp = Number(document.getElementById('pg-input-retail') ? document.getElementById('pg-input-retail').value : playgroundState.retailPrice) || 0;
        const itemM = Number(document.getElementById('pg-input-margin') ? document.getElementById('pg-input-margin').value : playgroundState.marginPercent) || mGlobal;
        costoReal = Math.round(pvp * (1 - (itemM / 100)));
        const costDisp = document.getElementById('pg-cost-fixed-display');
        if (costDisp) costDisp.innerText = `$${costoReal.toLocaleString('es-AR')}`;
      } else {
        const disc = Number(document.getElementById('pg-input-disc-pct') ? document.getElementById('pg-input-disc-pct').value : playgroundState.discountPercent) || 25;
        const maxTicket = Number(document.getElementById('pg-input-ticket-max') ? document.getElementById('pg-input-ticket-max').value : playgroundState.ticketMax) || 16000;
        costoReal = Math.round(maxTicket * (disc / 100));
        const costDisp = document.getElementById('pg-cost-percent-display');
        if (costDisp) costDisp.innerText = `$${costoReal.toLocaleString('es-AR')}`;
      }

      const ptsSugeridos = calculatePlaygroundSuggestedPoints(costoReal);
      
      const minSlider = Math.max(20, Math.floor(ptsSugeridos * 0.4 / 10) * 10);
      const maxSlider = Math.max(120, Math.ceil(ptsSugeridos * 1.8 / 10) * 10);

      const slider = document.getElementById('pg-pts-slider');
      const ptsInput = document.getElementById('pg-pts-input');

      if (slider) {
        slider.min = minSlider;
        slider.max = maxSlider;
      }

      const minLbl = document.getElementById('pg-slider-min-lbl');
      if (minLbl) minLbl.innerText = `Más accesible (${minSlider} pts)`;
      const sugLbl = document.getElementById('pg-slider-sug-lbl');
      if (sugLbl) sugLbl.innerText = `Sugerido (${ptsSugeridos} pts)`;
      const maxLbl = document.getElementById('pg-slider-max-lbl');
      if (maxLbl) maxLbl.innerText = `Ultra seguro (${maxSlider} pts)`;

      if (resetSliderToSug && playgroundState.customPoints === null) {
        if (ptsInput) ptsInput.value = ptsSugeridos;
        if (slider) slider.value = ptsSugeridos;
      }

      const currentPts = Number(ptsInput ? ptsInput.value : ptsSugeridos) || ptsSugeridos;

      const sugBtn = document.getElementById('pg-sug-btn');
      if (sugBtn) sugBtn.innerText = `↺ Restablecer Puntos Sugeridos (${ptsSugeridos} PTS)`;

      const ptsPagados1er = Math.max(10, currentPts - bonoBienvenida);
      const gasto1er = ptsPagados1er * 1000;
      const gastoReg = currentPts * 1000;
      const pct1er = gasto1er > 0 ? (costoReal / gasto1er) * 100 : 0;
      const pctReg = gastoReg > 0 ? (costoReal / gastoReg) * 100 : 0;
      const vPuntoItem = currentPts > 0 ? (costoReal / currentPts).toFixed(1) : "0.0";

      const isDeficit = pct1er > (cmax + 0.05);
      const isWarning = (!isDeficit) && (pct1er > (crec + 0.05));
      const isSafe = !isDeficit && !isWarning;

      let statusColor = '#56d364';
      let trafficBg = 'rgba(35, 134, 54, 0.14)';
      let trafficBorder = '#238636';
      let trafficTitle = '✓ DENTRO DEL OBJETIVO SEGURO';
      let trafficExplanation = `<b>Bono de 20 pts absorbido:</b> En el 1er canje el costo es de <b>${pct1er.toFixed(1)}%</b> (≤ objetivo ${crec}%). En canjes siguientes se reduce a <b>${pctReg.toFixed(1)}%</b>.`;

      if (isDeficit) {
        statusColor = '#ff7b72';
        trafficBg = 'rgba(248, 81, 73, 0.16)';
        trafficBorder = '#f85149';
        trafficTitle = '🚨 DÉFICIT: PERFORA MARGEN MÁXIMO';
        trafficExplanation = `Supera el techo seguro (${cmax}%). Con este puntaje el comercio subsidia más de lo que la recurrencia proyectada puede compensar.`;
      } else if (isWarning) {
        statusColor = '#f59e0b';
        trafficBg = 'rgba(245, 158, 11, 0.14)';
        trafficBorder = '#f59e0b';
        trafficTitle = '⚠️ EXCEDE OBJETIVO · CONSUME COLCHÓN';
        trafficExplanation = `Supera el objetivo deseado (${crec}%), pero no perfora el techo (${cmax}%). Reduce tu colchón de seguridad ante contingencias.`;
      }

      if (ptsInput) ptsInput.style.color = statusColor;
      const ptsBadge = document.getElementById('pg-pts-badge-txt');
      if (ptsBadge) ptsBadge.style.color = statusColor;

      const tBox = document.getElementById('pg-traffic-box');
      if (tBox) {
        tBox.style.background = trafficBg;
        tBox.style.borderColor = trafficBorder;
      }
      const tTitle = document.getElementById('pg-traffic-title');
      if (tTitle) {
        tTitle.innerText = trafficTitle;
        tTitle.style.color = statusColor;
      }
      const tPct = document.getElementById('pg-traffic-pct');
      if (tPct) {
        tPct.innerText = `${pct1er.toFixed(1)}%`;
        tPct.style.color = statusColor;
      }
      const tExp = document.getElementById('pg-traffic-exp');
      if (tExp) tExp.innerHTML = trafficExplanation;

      const mGasto1er = document.getElementById('pg-metric-gasto1er');
      if (mGasto1er) mGasto1er.innerText = `$${gasto1er.toLocaleString('es-AR')}`;
      const mSubGasto = document.getElementById('pg-metric-gasto1er-sub');
      if (mSubGasto) mSubGasto.innerText = `(${ptsPagados1er} pts pagados + 20 regalo)`;

      const mCosto = document.getElementById('pg-metric-costo');
      if (mCosto) mCosto.innerText = `-$${costoReal.toLocaleString('es-AR')}`;

      const mPctReg = document.getElementById('pg-metric-pctreg');
      if (mPctReg) mPctReg.innerText = `${pctReg.toFixed(1)}%`;

      const mVpunto = document.getElementById('pg-metric-vpunto');
      if (mVpunto) mVpunto.innerText = `$${vPuntoItem} / pt`;

      const saveBtn = document.getElementById('pg-save-btn');
      if (saveBtn) {
        saveBtn.style.background = isDeficit ? '#e04a3f' : 'var(--success)';
      }
    }

    function savePlaygroundPrizeToCatalog() {
      const nameInput = document.getElementById('pg-input-name');
      const name = (nameInput ? nameInput.value : playgroundState.name || '').trim();
      if (!name) {
        alert("Por favor escribí el nombre del producto o beneficio.");
        return;
      }

      const mGlobal = (Number(document.getElementById('cfg-margin-input') ? document.getElementById('cfg-margin-input').value : stateB.config.marginPercent) || 65);
      const isPercent = (playgroundState.type === 'PERCENT_CAP');
      
      let retailPrice = 0;
      let worstCaseCost = 0;
      if (!isPercent) {
        retailPrice = Number(document.getElementById('pg-input-retail') ? document.getElementById('pg-input-retail').value : playgroundState.retailPrice) || 4500;
        const itemMargin = Number(document.getElementById('pg-input-margin') ? document.getElementById('pg-input-margin').value : playgroundState.marginPercent) || mGlobal;
        worstCaseCost = Math.round(retailPrice * (1 - (itemMargin / 100)));
      } else {
        const discPct = Number(document.getElementById('pg-input-disc-pct') ? document.getElementById('pg-input-disc-pct').value : playgroundState.discountPercent) || 25;
        const ticketMax = Number(document.getElementById('pg-input-ticket-max') ? document.getElementById('pg-input-ticket-max').value : playgroundState.ticketMax) || 16000;
        retailPrice = ticketMax;
        worstCaseCost = Math.round(ticketMax * (discPct / 100));
      }

      const ptsInput = document.getElementById('pg-pts-input');
      const pts = Number(ptsInput ? ptsInput.value : (playgroundState.customPoints || calculatePlaygroundSuggestedPoints(worstCaseCost))) || 100;

      const newPrize = {
        id: Date.now(),
        name: name,
        type: playgroundState.type,
        retailPrice: retailPrice,
        worstCaseCost: worstCaseCost,
        points: pts,
        isDefault: false,
        isCustomPoints: true
      };

      stateB.config.prizes.push(newPrize);
      stateB.config.activePrizeIndex = stateB.config.prizes.length - 1;
      closePrizePlaygroundModal();
      updateSetupMath(true);
    }

    function applySetupAndGoToCashier() {
      const m = (Number(document.getElementById('cfg-margin-input') ? document.getElementById('cfg-margin-input').value : stateB.config.marginPercent) || 65);

          prizeAlert = `
            <div class="alert-box success">
              🎁 <b>CLIENTE CON BENEFICIO DISPONIBLE</b><br>
              Tiene guardado: <b>Combo 15 Piezas Gratis</b> (<code>${c.prizeCode}</code>).
            </div>
          `;
          actionButtons = `
            <button class="btn btn-action" style="background: var(--success);" onclick="stateA.cajaMode = 'CANJE_CONFIRM'; renderA();">
              [ 1. Canjear Premio Hoy (Combo Gratis) ]
            </button>
            <button class="btn btn-action" style="margin-top: 4px;" onclick="sumarVisitaConservandoPremioA()">
              [ 2. Pagar normal y Sumar Visita (Guardar Premio) ]
            </button>
          `;
        } else {
          actionButtons = `
            <button class="btn btn-action" onclick="confirmarCompraA()">
              [ + SUMAR VISITA ]
            </button>
          `;
        }

        el.innerHTML = `
          <div class="card">
            <div style="font-size: 1.05rem; font-weight: 700;">${c.name}</div>
            <div class="metric-box">
              <span style="font-size: 0.78rem; color: var(--text-muted);">Estado:</span>
              <span style="font-size: 1.1rem; font-weight: 800; color: #f59e0b;">⭐ ${c.visits} / 8 visitas</span>
            </div>
            ${prizeAlert}
            ${actionButtons}
            <button class="btn btn-outline" style="margin-top: 4px;" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cancelar</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "PROCESSING") {
        el.innerHTML = `
          <div class="card" style="text-align: center; padding: 40px 14px;">
            <div style="font-size: 1.3rem;">⏳</div>
            <div style="font-weight: 700; margin: 10px 0 4px;">Registrando operación...</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Disparando notificación oficial a WhatsApp</p>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "SUCCESS_DONE") {
        el.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 1.4rem; color: var(--success);">✓</div>
            <div style="font-weight: 700; font-size: 1.05rem;">Visita Acreditada</div>
            <div style="font-size: 1.3rem; font-weight: 800; color: #56d364; margin: 6px 0;">⭐ ${c.visits} / 8</div>
            <button class="btn btn-action" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Nueva Venta</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "WARNING_QUICK_BUY") {
        el.innerHTML = `
          <div class="card">
            <div style="font-size: 1rem; font-weight: 700;">${c.name}</div>
            <div class="alert-box warn">
              <b>COMPRA RECIENTE (hace 30s)</b><br>¿Confirmar 2do ticket legítimo (take away)?
            </div>
            <button class="btn btn-action" onclick="confirmarCompraA()">[ SÍ, CONFIRMAR SEGUNDA COMPRA ]</button>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cancelar</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "CANJE_CONFIRM") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700;">Canje de Recompensa</div>
            <div class="alert-box success">Beneficio: <b>Combo 15 Piezas</b><br>Código: <code>${c.prizeCode}</code></div>
            <button class="btn btn-action" style="background: var(--success);" onclick="canjearA()">[ ENTREGAR Y QUEMAR CÓDIGO ]</button>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'CLIENT_DETECTED'; renderA();">Volver</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "CANJE_DONE") {
        el.innerHTML = `
          <div class="card" style="text-align: center;">
            <div style="font-size: 1.4rem; color: var(--success);">✓</div>
            <div style="font-weight: 700;">Premio Entregado</div>
            <p style="font-size: 0.75rem; color: var(--text-muted);">Código quemado. Tarjeta en 0/8.</p>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Cámara Lista</button>
          </div>
        `;
        return;
      }

      if (stateA.cajaMode === "REUSED_BLOCKED") {
        el.innerHTML = `
          <div class="card">
            <div style="font-weight: 700; color: var(--danger);">Rechazo de Canje</div>
            <div class="alert-box danger">PREMIO YA UTILIZADO el ${c.redeemedAt} por Caja 1.</div>
            <button class="btn btn-outline" onclick="stateA.cajaMode = 'SCAN_READY'; renderA();">Volver a Cámara</button>
          </div>
        `;
        return;
      }
    }

    function executeScanByStoryA() {
      if (stateA.client.isReusedCodeAttempt) stateA.cajaMode = "REUSED_BLOCKED";
      else if (stateA.client.isImmediateSecondBuyStory) stateA.cajaMode = "WARNING_QUICK_BUY";
      else stateA.cajaMode = "CLIENT_DETECTED";
      renderA();
    }

    function confirmarCompraA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits++;
        const v = stateA.client.visits;
        stateA.cajaMode = "SUCCESS_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🎉 <b>¡Visita acreditada!</b><br>Tu tarjeta ahora está en <b>${v} / 8 ⭐</b>.`,
          snapshotVisits: v,
          time: "20:15"
        });
        renderA();
      }, 1000);
    }

    function sumarVisitaConservandoPremioA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits = 1;
        stateA.cajaMode = "SUCCESS_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🎉 <b>¡Visita acreditada!</b><br>Nuevo ciclo: <b>1 / 8 ⭐</b>.<br>🎁 Premio Combo 15p sigue guardado.`,
          snapshotVisits: 1,
          time: "20:25"
        });
        renderA();
      }, 1000);
    }

    function canjearA() {
      stateA.cajaMode = "PROCESSING";
      renderA();
      setTimeout(() => {
        stateA.client.visits = 0;
        stateA.client.hasAvailablePrize = false;
        stateA.cajaMode = "CANJE_DONE";
        stateA.chatHistory.push({
          type: "recv",
          text: `🍣 <b>¡Premio entregado!</b><br>Combo 15p canjeado. Código quemado.<br>Nueva tarjeta en <b>0 / 8 ⭐</b>.`,
          snapshotVisits: 0,
          time: "21:10"
        });
        renderA();
      }, 1000);
    }

    function renderWhatsAppA() {
      let el = document.getElementById('wa-chat');
      if (!el) {
        const bodyEl = document.getElementById('col2-body');
        if (bodyEl) {
          bodyEl.innerHTML = '<div class="wa-chat" id="wa-chat"></div>';
          el = document.getElementById('wa-chat');
        }
      }
      if (!el) return;
      let html = '';
      stateA.chatHistory.forEach(msg => {
        let stamps = '';
        for (let i = 1; i <= 8; i++) {
          const isFilled = i <= msg.snapshotVisits;
          const isPrize = i === 8;
          let cls = 'stamp';
          if (isPrize) cls += ' prize';
          if (isFilled) cls += ' active';
          stamps += `<div class="${cls}">${isPrize ? '🎁' : i}</div>`;
        }
        html += `
          <div class="wa-msg ${msg.type}">
            ${msg.text}
            <div class="stamps-box">
              <div style="font-size: 0.65rem; color: #8b949e; text-transform: uppercase;">Tarjeta Digital</div>
              <div class="grid-stamps">${stamps}</div>
              <div class="qr-client-img"><div class="qr-lines"></div></div>
              <div style="font-size: 0.65rem; color: #8b949e; margin-top: 3px;">Mostralo al pagar</div>
            </div>
            <div class="wa-time">${msg.time} ✓✓</div>
          </div>
        `;
      });
      el.innerHTML = html;
      el.scrollTop = el.scrollHeight;
    }

    switchSystemMode('PUNTOS');
  </script>

  <!-- MODAL PLAYGROUND PARA DISEÑAR NUEVOS BENEFICIOS -->
  <div id="prize-playground-modal" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); z-index: 99999; align-items: center; justify-content: center; backdrop-filter: blur(5px); padding: 14px;" onclick="if(event.target === this) closePrizePlaygroundModal();">
    <div id="playground-modal-content" class="modal-card" style="background: #12151e; border: 1px solid #2d3448; border-radius: 12px; width: 100%; max-width: 480px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 45px rgba(0,0,0,0.8);">
    </div>
  </div>
</body>
</html>
